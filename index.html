<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F4A78B">
<title>鸭鸭的加油站</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="dns-prefetch" href="https://static.cloudbase.net">
<style>
:root{--bg:#FBF6EE;--card:#fff;--text:#5C4D3A;--muted:#97876E;--border:#F0E5D2;--peach:#F4A78B;--peach-bg:#FCE8DC;--mint:#88C9A1;--mint-bg:#DDF1E5;--lavender:#B8A0D9;--lavender-bg:#EBE3F4;--sky:#88B8DD;--sky-bg:#D9E6F2;--radius:16px;--radius-sm:12px;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:.9rem}
input,textarea,select{font-family:inherit;font-size:.9rem;color:var(--text);outline:none;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--card)}
input:focus,textarea:focus,select:focus{border-color:var(--peach)}

#app{display:flex;min-height:100vh}
#sidebar{width:200px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;padding:16px 12px}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:8px}
.side-logo{font-size:1rem;font-weight:700;color:var(--peach);padding:4px 8px 0 8px}
.side-close{display:none;width:32px;height:32px;border-radius:50%;background:var(--peach-bg);color:var(--peach);font-size:1rem;font-weight:700;align-items:center;justify-content:center}
.sub-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.sub-sec-title{font-size:.65rem;color:var(--muted);padding:10px 8px 4px;text-transform:uppercase;letter-spacing:.5px}
.sub-item{padding:9px 12px;border-radius:8px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px;transition:all .15s}
.sub-item:hover{background:var(--peach-bg);color:var(--text)}
.sub-item.active{background:var(--peach);color:#fff;font-weight:600}
.sub-icon{width:18px;text-align:center;font-size:.75rem;flex-shrink:0}
.side-toggle{display:none}

#main{flex:1;margin-left:200px;padding:20px 28px 40px}
#content{display:flex;flex-wrap:wrap;gap:14px}
#content>.card{flex:1 1 380px;margin-bottom:0}
#content>.hero-card{flex:1 1 100%}
#topbar{padding:0 0 16px;display:flex;align-items:center;justify-content:space-between}
#topbar h1{font-size:1.3rem;font-weight:700}
.breadcrumb{font-size:.8rem;color:var(--muted)}
.menu-toggle{display:none}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(60,40,20,.4);z-index:99;opacity:0;transition:opacity .25s}
.sidebar-backdrop.show{display:block;opacity:1}

.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.card-title{font-size:.88rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-title-left{display:flex;align-items:center;gap:6px}

.water-cup{width:18px;height:22px;display:inline-block;vertical-align:middle}

.btn{padding:9px 18px;border-radius:22px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn-primary{background:var(--peach);color:#fff}
.btn-outline{border:1.5px solid var(--border);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:.75rem}.btn-xs{padding:4px 10px;font-size:.7rem}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600}
.badge-peach{background:var(--peach-bg);color:#A8604A}.badge-mint{background:var(--mint-bg);color:#3E8E66}
.badge-lavender{background:var(--lavender-bg);color:#6B4F8C}.badge-soft{background:var(--bg);color:var(--muted)}
.badge-sky{background:var(--sky-bg);color:#3A6B9E}

.task-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:.88rem}
.task-row:last-child{border-bottom:none}
.task-cb{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;transition:all .15s}
.task-cb.checked{background:var(--mint);border-color:var(--mint);color:#fff}
.task-title{flex:1;font-weight:500}.task-done{opacity:.5;text-decoration:line-through}
.add-bar{display:flex;gap:8px;margin-bottom:12px}.add-bar input{flex:1}

.checkin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.checkin-item{padding:14px 10px;text-align:center;border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;border:2px solid transparent;transition:all .15s}
.checkin-item:hover{border-color:var(--peach)}
.checkin-item.done{background:var(--mint-bg);border-color:var(--mint)}
.checkin-item .ci-icon{font-size:1.5rem;margin-bottom:4px;line-height:1}
.checkin-item .ci-name{font-size:.78rem;font-weight:600}
.checkin-item .ci-status{font-size:.65rem;color:var(--muted);margin-top:2px}

.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-day-header{font-size:.65rem;color:var(--muted);padding:4px}
.cal-day{padding:8px 4px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .15s;position:relative}
.cal-day:hover{background:var(--peach-bg)}
.cal-day.today{background:var(--peach);color:#fff;font-weight:700}
.cal-day.selected{background:var(--sky-bg);font-weight:600}
.cal-day.has-done{border-bottom:2px solid var(--mint)}
.cal-day.has-sched{background:var(--lavender-bg);font-weight:600}
.cal-day .sched-count{font-size:.55rem;color:var(--lavender);position:absolute;bottom:1px;right:2px;font-weight:700}
.cal-day.today .sched-count{color:#fff}
.cal-day.other{color:#ccc}

/* Flashcard */
.flashcard-container{perspective:1000px;width:100%;max-width:360px;height:240px;margin:0 auto}
.flashcard{width:100%;height:100%;cursor:pointer;position:relative}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.flashcard-front{background:linear-gradient(135deg,var(--sky-bg),var(--lavender-bg))}
.flashcard-back{background:linear-gradient(135deg,var(--mint-bg),var(--peach-bg));transform:rotateY(180deg)}
.flashcard-front .fc-word{font-size:1.8rem;font-weight:700;margin-bottom:8px}
.flashcard-front .fc-scene{font-size:.75rem;color:var(--muted)}
.flashcard-back .fc-meaning{font-size:1.2rem;font-weight:600;margin-bottom:6px;color:var(--text)}
.flashcard-back .fc-kana{font-size:1rem;color:var(--lavender);font-weight:600}
.flashcard-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.flashcard-progress{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:10px}

/* Timeline */
.timeline{padding:8px 0}
.timeline-item{display:flex;gap:12px;padding:6px 0;position:relative}
.timeline-item:before{content:'';position:absolute;left:7px;top:20px;bottom:-6px;width:2px;background:var(--border)}
.timeline-item:last-child:before{display:none}
.timeline-dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--border);background:var(--card);flex-shrink:0;margin-top:2px;z-index:1}
.timeline-dot.done{border-color:var(--mint);background:var(--mint)}
.timeline-dot.current{border-color:var(--peach);background:var(--peach)}
.timeline-content{flex:1;font-size:.82rem}
.timeline-label{font-weight:600;margin-bottom:2px}
.timeline-date{font-size:.7rem;color:var(--muted)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--card);border-top:1px solid var(--border);justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;color:var(--muted);min-height:52px;justify-content:center;font-weight:500}
.nav-tab.active{color:var(--peach);font-weight:700}
.nav-tab .nav-icon{font-size:1.2rem;font-weight:700}
.nav-tab.has-sub{position:relative}
.nav-tab .nav-arrow{font-size:.5rem;opacity:.6;margin-top:-2px}

.sub-sheet-overlay{display:none;position:fixed;inset:0;z-index:88;background:rgba(60,40,20,.3)}
.sub-sheet-overlay.show{display:block}
.sub-sheet{position:fixed;bottom:0;left:0;right:0;z-index:89;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0));box-shadow:0 -4px 20px rgba(0,0,0,.1);display:none;flex-direction:column;gap:6px;transform:translateY(100%);transition:transform .25s}
.sub-sheet.show{display:flex;animation:sheetUp .25s forwards}
@keyframes sheetUp{to{transform:translateY(0)}}
.sub-sheet-title{font-size:.78rem;color:var(--muted);font-weight:600;padding:4px 8px 8px}
.sub-sheet-item{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;font-size:.92rem;font-weight:500;cursor:pointer;transition:background .15s}
.sub-sheet-item:active{background:var(--peach-bg)}
.sub-sheet-item.active{background:var(--peach-bg);color:var(--peach);font-weight:700}
.sub-sheet-item .ssi-icon{width:28px;height:28px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--muted);flex-shrink:0}
.sub-sheet-item.active .ssi-icon{background:var(--peach);color:#fff}

.ai-fab{position:fixed;bottom:24px;right:24px;z-index:85;width:52px;height:52px;border-radius:50%;background:var(--peach);color:#fff;box-shadow:0 4px 20px rgba(244,167,139,.4);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;transition:all .2s}
.ai-panel{position:fixed;bottom:88px;right:24px;z-index:84;width:340px;max-height:420px;background:var(--card);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.12);display:none;flex-direction:column;overflow:hidden}
.ai-panel.show{display:flex}
.ai-panel-header{padding:14px 18px;border-bottom:1px solid var(--border);font-size:.88rem;font-weight:700;display:flex;justify-content:space-between}
.ai-panel-body{flex:1;overflow-y:auto;padding:10px;min-height:100px;font-size:.82rem}
.ai-panel-input{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:6px}
.ai-panel-input input{flex:1}

.modal-overlay{position:fixed;inset:0;background:rgba(60,40,20,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:16px}.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px;font-weight:600}
.modal-field input,.modal-field textarea,.modal-field select{width:100%}
.modal-field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(80,60,40,.9);color:#fff;padding:10px 24px;border-radius:22px;font-size:.8rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#FCE8DC,#FBEFCF);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:var(--radius);padding:32px 28px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.login-card h2{text-align:center;margin-bottom:18px;font-size:1.2rem}
.login-field{margin-bottom:14px}.login-field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px}
.login-field input{width:100%;padding:12px 16px;border-radius:22px}
.login-err{font-size:.72rem;color:#E84040;min-height:20px;margin-bottom:8px}
.login-btn{width:100%;padding:13px;background:var(--peach);color:#fff;border-radius:22px;font-size:.95rem;font-weight:700}

@media(max-width:768px){
  html{font-size:17px}
  #sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:200;box-shadow:2px 0 12px rgba(0,0,0,.1)}
  #sidebar.open{transform:translateX(0);display:flex!important}
  .side-close{display:flex}
  .menu-toggle{display:flex;width:36px;height:36px;border-radius:10px;background:var(--peach-bg);color:var(--peach);align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
  .menu-toggle:active{background:var(--peach);color:#fff}
  #main{margin-left:0!important;padding:12px 14px 100px;width:100%}
  #content{flex-direction:column}
  #content>.card{flex:1 1 100%;max-width:100%}
  #topbar{padding:0 0 12px;gap:10px}#topbar h1{font-size:1.2rem}
  .bottom-nav{display:flex}
  .ai-fab{bottom:80px;right:14px}.ai-panel{bottom:144px;right:14px;width:calc(100vw - 28px)}
  .add-bar{flex-direction:column}.btn{padding:10px 20px;font-size:.85rem}
  .card{padding:16px 14px;margin-bottom:10px;border-radius:var(--radius-sm)}
  .task-row{padding:12px 14px;font-size:.92rem}.task-cb{width:24px;height:24px}
  input,textarea,select{font-size:16px;padding:12px 14px}
  .checkin-grid{grid-template-columns:repeat(2,1fr)}
  .modal{max-width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0))}
  .modal-overlay{align-items:flex-end}
  .hero-card>div{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
  .hero-card>div>div:last-child{text-align:right}
  #toast{bottom:140px}
  .water-cup{width:24px;height:30px}
  .flashcard-container{height:200px}
}
</style>
</head>
<body>
<div id="app">

<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>鸭鸭的加油站</h2>
    <div class="login-field"><label>用户名</label><input id="login-user" value="admin"></div>
    <div class="login-field"><label>密码</label><input id="login-pass" type="password" value="Admin123"></div>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" onclick="doLogin()">进入</button>
  </div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

<nav id="sidebar">
  <div class="sidebar-header">
    <div class="side-logo">鸭鸭的加油站</div>
    <button class="side-close" onclick="toggleSidebar()">✕</button>
  </div>
  <div class="sub-nav" id="sub-nav"></div>
</nav>

<main id="main">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 id="page-title">总览</h1>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
  <div id="content"></div>
</main>

<button class="ai-fab" onclick="toggleAI()">AI</button>
<div class="ai-panel" id="ai-panel">
  <div class="ai-panel-header">智能助手 <button onclick="toggleAI()">✕</button></div>
  <div class="ai-panel-body" id="ai-body">你好！</div>
  <div class="ai-panel-input"><input id="ai-input" placeholder="描述你想做的事..." onkeypress="if(event.key==='Enter')runAI()"><button class="btn btn-primary btn-xs" onclick="runAI()">发送</button></div>
</div>

<div class="bottom-nav" id="bottom-nav"></div>
<div class="sub-sheet-overlay" id="sub-sheet-overlay" onclick="closeSubSheet()"></div>
<div class="sub-sheet" id="sub-sheet"></div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-body"></div></div>
<div id="toast"></div>

</div>

<script>
let _sdkLoaded=false,_sdkLoading=false;
function loadSDK(){return new Promise((resolve)=>{
  if(typeof cloudbase!=='undefined'){_sdkLoaded=true;resolve();return}
  if(_sdkLoading){var t=setInterval(()=>{if(_sdkLoaded){clearInterval(t);resolve()}},100);return}
  _sdkLoading=true;
  var s=document.createElement('script');
  s.src='https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js';
  s.onload=()=>{_sdkLoaded=true;resolve()};
  s.onerror=()=>{_sdkLoading=false;resolve()};
  document.head.appendChild(s);
})}
const genId=()=>'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}

// Seeded random for daily cards
function seededRandom(seed){
  let s=seed;
  return ()=>{s=(s*9301+49297)%233280;return s/233280};
}
function getTodayCards(){
  const seed=parseInt(today().replace(/-/g,''));
  const rng=seededRandom(seed);
  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const words=shuffle(japaneseWordBank.words).slice(0,10);
  const sentences=shuffle(japaneseWordBank.sentences).slice(0,5);
  return {words,sentences,all:[...words,...sentences]};
}

const Store={
  envId:'yayaliu-d4g1i1dc2fdb04417',
  credentials:{username:'admin',password:'Admin123'},
  data:{tasks:[],health:[],xhs:[],investments:[],stores:[],inspirations:[],study:[],checkinRecords:[],virtualData:[],bookRecommends:[]},
  app:null,auth:null,db:null,ready:false,_hadSync:false,
  async initCloud(){
    await loadSDK();
    if(typeof cloudbase==='undefined')throw new Error('SDK未加载');
    const app=cloudbase.init({env:this.envId});
    const{error}=await app.auth.signInWithPassword({username:this.credentials.username,password:this.credentials.password});
    if(error)throw new Error(error.message);
    this.auth=app.auth;this.app=app;this.db=app.database();this.ready=true;
    await this.loadFromCloud();return true
  },
  async loadFromCloud(){
    if(!this.db)return;
    const dedup=(arr,k='id')=>{const s=new Set();return arr.filter(x=>{const v=x[k]||'';if(s.has(v))return false;s.add(v);return true})};
    const strip=d=>{const{_id,_openid,...r}=d;return r};
    const sg=async c=>{try{return(await this.db.collection(c).limit(1000).get()).data.map(strip)}catch(e){return[]}};
    Object.assign(this.data,{
      tasks:dedup(await sg('tasks')),health:dedup(await sg('health_records')),xhs:dedup(await sg('xiaohongshu')),
      investments:dedup(await sg('investments')),stores:dedup(await sg('stores')),inspirations:dedup(await sg('inspirations')),
      study:dedup(await sg('study_notes')),checkinRecords:await sg('checkin_records'),
      virtualData:dedup(await sg('virtual_data')),bookRecommends:dedup(await sg('book_recommends'))
    });
    const has=Object.values(this.data).some(v=>Array.isArray(v)&&v.length>0);
    if(has){this.saveLocal();this._hadSync=true}else if(this._hadSync){this.data={tasks:[],health:[],xhs:[],investments:[],stores:[],inspirations:[],study:[],checkinRecords:[],virtualData:[],bookRecommends:[]};this.saveLocal()}
    else if(this.data.tasks.length||this.data.study.length)await this.saveToCloud()
  },
  async saveToCloud(){
    if(!this.db)return;
    const upsert=async(col,it)=>{
      try{
        const existing=(await col.limit(1000).get()).data;
        const eMap=new Map(existing.map(d=>[d.id,d._id]));
        for(const i of it){
          const eid=eMap.get(i.id);
          if(eid){try{await col.doc(eid).set({...i})}catch(e){}}
          else{try{await col.add({...i})}catch(e){}}
        }
        const newIds=new Set(it.map(i=>i.id));
        for(const d of existing){
          if(!newIds.has(d.id)){try{await col.doc(d._id).remove()}catch(e){}}
        }
      }catch(e){console.warn('upsert fail:',col._requestConfig?.collectionName,e.message)}
    };
    const colls=[
      ['tasks',this.data.tasks||[]],
      ['health_records',this.data.health||[]],
      ['xiaohongshu',this.data.xhs||[]],
      ['investments',this.data.investments||[]],
      ['stores',this.data.stores||[]],
      ['inspirations',this.data.inspirations||[]],
      ['study_notes',this.data.study||[]],
      ['virtual_data',this.data.virtualData||[]],
      ['book_recommends',this.data.bookRecommends||[]]
    ];
    for(const [name,items] of colls)await upsert(this.db.collection(name),items);
    await upsert(this.db.collection('checkin_records'),this.data.checkinRecords||[]);
    this._hadSync=true;localStorage.setItem('ws_had','1');
  },
  loadLocal(){try{const r=localStorage.getItem('ws_data_v7');if(r)this.data=Object.assign(this.data,JSON.parse(r));this._hadSync=localStorage.getItem('ws_had')==='1'}catch(e){}},
  saveLocal(){localStorage.setItem('ws_data_v7',JSON.stringify(this.data))},
  async save(){this.saveLocal();clearTimeout(this._st);this._st=setTimeout(()=>this.saveToCloud(),500)},
  getRecord(type,dateStr){return this.data.checkinRecords.find(r=>r.type===type&&r.date===dateStr)},
  getWater(){const r=this.getRecord('water',today());return r?r.count:0},
  addWater(){const d=today();let r=this.getRecord('water',d);if(r){if(r.count<8)r.count++}else this.data.checkinRecords.push({id:genId(),type:'water',date:d,count:1});this.saveLocal();this.saveToCloud();return this.getWater()},
  isSleepEarly(){const y=new Date();y.setDate(y.getDate()-1);return !!this.getRecord('sleep_early',y.toISOString().slice(0,10))},
  toggleSleep(){const d=new Date();d.setDate(d.getDate()-1);const ds=d.toISOString().slice(0,10);const idx=this.data.checkinRecords.findIndex(r=>r.type==='sleep_early'&&r.date===ds);if(idx>=0)this.data.checkinRecords.splice(idx,1);else this.data.checkinRecords.push({id:genId(),type:'sleep_early',date:ds,value:true});this.saveLocal();this.saveToCloud()},
  isWakeEarly(){return !!this.getRecord('wake_early',today())},
  toggleWake(){const d=today();const idx=this.data.checkinRecords.findIndex(r=>r.type==='wake_early'&&r.date===d);if(idx>=0)this.data.checkinRecords.splice(idx,1);else this.data.checkinRecords.push({id:genId(),type:'wake_early',date:d,value:true});this.saveLocal();this.saveToCloud()},
  getMealLevel(meal){const r=this.data.checkinRecords.find(r=>r.type==='meal'&&r.date===today()&&r.meal===meal);return r?r.level:null},
  setMeal(meal,level){const d=today();const idx=this.data.checkinRecords.findIndex(r=>r.type==='meal'&&r.date===d&&r.meal===meal);if(level===null&&idx>=0){this.data.checkinRecords.splice(idx,1)}else if(idx>=0){this.data.checkinRecords[idx].level=level}else this.data.checkinRecords.push({id:genId(),type:'meal',date:d,meal,level});this.saveLocal();this.saveToCloud()},
  getWeekExercises(){const now=new Date(),dow=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1));const ws=mon.toISOString().slice(0,10);return this.data.checkinRecords.filter(r=>r.type==='exercise'&&r.date>=ws).length},
  addExercise(){this.data.checkinRecords.push({id:genId(),type:'exercise',date:today(),value:true});this.saveLocal();this.saveToCloud();return this.getWeekExercises()},
  undoExercise(){const d=today();const idx=this.data.checkinRecords.findIndex(r=>r.type==='exercise'&&r.date===d);if(idx>=0)this.data.checkinRecords.splice(idx,1);this.saveLocal();this.saveToCloud()}

async function fetchWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.26&longitude=108.94&current=temperature_2m,weather_code&timezone=Asia/Shanghai');
    const d=await r.json();const wc={0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',48:'雾',51:'小雨',53:'中雨',55:'大雨',61:'阵雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'中雨',82:'大雨',95:'雷雨',96:'雷雨',99:'雷雨'};
    const temp=Math.round(d.current.temperature_2m);
    const desc=wc[d.current.weather_code]||'多云';
    return{temp,desc,text:temp+'° '+desc};
  }catch(e){return{temp:'--',desc:'',text:'--'}}
}

// ====== Calendar ======
function renderCalendar(c){
  const now=calDate?new Date(calDate):new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=today();

  const doneDates=new Set();
  Store.data.checkinRecords.forEach(r=>doneDates.add(r.date));
  Store.data.tasks.filter(t=>t.completedAt).forEach(t=>doneDates.add(t.completedAt));

  const selectDate=calDate||todayStr;
  const selectedEvents=[];
  Store.data.checkinRecords.filter(r=>r.date===selectDate).forEach(r=>{
    let title='';if(r.type==='water')title='喝水 '+r.count+'杯';
    else if(r.type==='sleep_early')title='早睡';
    else if(r.type==='wake_early')title='早起';
    else if(r.type==='meal')title=r.meal+'餐('+(r.level==='green'?'绿灯':r.level==='yellow'?'黄灯':'红灯')+')';
    else if(r.type==='exercise')title='运动';
    else if(r.type==='japanese')title='日语打卡';
    if(title)selectedEvents.push({type:'checkin',title,date:r.date});
  });
  Store.data.tasks.filter(t=>t.completedAt===selectDate).forEach(t=>selectedEvents.push({type:'task',title:t.title,date:t.completedAt,module:t.module}));

  let calHTML='<div class="cal-header"><button class="btn-outline btn-xs" onclick="calDate=null;calDate=new Date('+year+','+(month-1)+',1);renderContent()">◀</button><span style="font-weight:700">'+year+'年'+(month+1)+'月</span><button class="btn-outline btn-xs" onclick="calDate=null;calDate=new Date('+year+','+(month+1)+',1);renderContent()">▶</button></div>';

  calHTML+='<div class="cal-grid"><div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>';

  for(let i=0;i<firstDay;i++)calHTML+='<div class="cal-day other"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayStr,isSelected=ds===selectDate,hasDone=doneDates.has(ds);
    calHTML+='<div class="cal-day'+ (isToday?' today':'')+ (isSelected?' selected':'')+ (hasDone?' has-done':'')+'" onclick="calDate=\''+ds+'\';renderContent()">'+d+'</div>';
  }
  calHTML+='</div><div style="margin-top:16px"><div class="card-title" style="margin-bottom:8px">'+(calDate||todayStr)+' 完成记录</div>';
  calHTML+=(selectedEvents.length?selectedEvents.map(e=>'<div class="task-row"><span class="badge '+(e.type==='checkin'?'badge-mint':'badge-peach')+'">'+(e.type==='checkin'?'打卡':'任务')+'</span><span>'+e.title+'</span></div>').join(''):'<div style="color:var(--muted);text-align:center;padding:16px">当天没有完成记录</div>');
  calHTML+='</div>';

  c.innerHTML='<div class="card">'+calHTML+'</div><div style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="navigate(\'home\')">← 返回总览</button></div>';
}

// 排期日历
function renderSchedule(c){
  const now=calDate?new Date(calDate):new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=today();
  const xhs=Store.data.xhs||[];

  // Count scheduled notes per date
  const schedMap={};
  xhs.forEach(x=>{if(x.scheduleDate){schedMap[x.scheduleDate]=(schedMap[x.scheduleDate]||0)+1}});

  let calHTML='<div class="cal-header"><button class="btn-outline btn-xs" onclick="calDate=null;calDate=new Date('+year+','+(month-1)+',1);renderContent()">◀</button><span style="font-weight:700">'+year+'年'+(month+1)+'月 排期日历</span><button class="btn-outline btn-xs" onclick="calDate=null;calDate=new Date('+year+','+(month+1)+',1);renderContent()">▶</button></div>';

  calHTML+='<div class="cal-grid"><div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>';

  for(let i=0;i<firstDay;i++)calHTML+='<div class="cal-day other"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayStr;
    const cnt=schedMap[ds]||0;
    calHTML+='<div class="cal-day'+(isToday?' today':'')+(cnt>0?' has-sched':'')+'" onclick="openScheduleModal(\''+ds+'\')">'+d+(cnt>0?'<span class="sched-count">'+cnt+'</span>':'')+'</div>';
  }
  calHTML+='</div>';

  // Show upcoming scheduled notes
  const upcoming=xhs.filter(x=>x.scheduleDate&&x.scheduleDate>=todayStr).sort((a,b)=>(a.scheduleDate||'').localeCompare(b.scheduleDate||''));
  calHTML+='<div style="margin-top:16px"><div class="card-title" style="margin-bottom:8px">即将排期 ('+upcoming.length+')</div>';
  calHTML+=(upcoming.length?upcoming.slice(0,10).map(x=>'<div class="task-row"><span class="badge badge-lavender">'+(x.scheduleDate||'')+'</span><span class="badge badge-soft">'+(x.account||'')+'</span><div class="task-title">'+x.title+'</div><span class="badge '+(x.stage==='已发布'?'badge-mint':'badge-peach')+'">'+x.stage+'</span></div>').join(''):'<div style="color:var(--muted);text-align:center;padding:16px">暂无排期</div>');
  calHTML+='</div>';

  c.innerHTML='<div class="card">'+calHTML+'</div>';
}

function saveNote(id){
  const data={
    account:document.getElementById('me-note-account').value,
    title:document.getElementById('me-note-title').value.trim(),
    scheduleDate:document.getElementById('me-note-schedule').value,
    stage:document.getElementById('me-note-stage').value,
    cost:parseFloat(document.getElementById('me-note-cost').value)||0,
    metrics:{
      reads:parseInt(document.getElementById('me-note-reads').value)||0,
      likes:parseInt(document.getElementById('me-note-likes').value)||0,
      saves:parseInt(document.getElementById('me-note-saves').value)||0
    }
  };
  if(!data.title){toast('请输入标题');return}
  if(id){const idx=Store.data.xhs.findIndex(x=>x.id===id);if(idx>=0)Store.data.xhs[idx]={...Store.data.xhs[idx],...data}}
  else{Store.data.xhs.push({id:genId(),...data,notes:'',createdAt:today()})}
  closeModal();Store.save();renderContent();toast('已保存');
}

function deleteNote(id){Store.data.xhs=Store.data.xhs.filter(x=>x.id!==id);Store.save();renderContent()}

      (catItems.length?catItems.map(v=>'<div class="task-row" style="flex-direction:column;align-items:stretch">'+

    }).join('');
}

function saveVData(id){
  const data={
    name:document.getElementById('me-vd-name').value.trim(),
    category:document.getElementById('me-vd-cat').value,
    summary:document.getElementById('me-vd-summary').value.trim(),
    status:document.getElementById('me-vd-status').value,
    storage:document.getElementById('me-vd-storage').value.trim(),
    demandCount:parseInt(document.getElementById('me-vd-demand').value)||0
  };
  if(!data.name){toast('请输入名称');return}
  if(id){const idx=Store.data.virtualData.findIndex(v=>v.id===id);if(idx>=0)Store.data.virtualData[idx]={...Store.data.virtualData[idx],...data}}
  else{Store.data.virtualData.push({id:genId(),...data,createdAt:today()})}
  closeModal();Store.save();renderContent();toast('已保存');
}

function cycleVDataStatus(id){
  const v=Store.data.virtualData.find(x=>x.id===id);if(!v)return;
  const statuses=['未开始','进行中','已完成','已上架'];
  const idx=statuses.indexOf(v.status);
  v.status=statuses[(idx+1)%statuses.length];
  Store.save();renderContent();
}

function deleteVData(id){Store.data.virtualData=Store.data.virtualData.filter(x=>x.id!==id);Store.save();renderContent()}

// ====== Study ======
function renderStudy(c){currentSub==='japanese'?renderJapanese(c):renderReading(c)}

    '<button class="btn '+(flashcardFlipped?'btn-outline':'btn-primary')+' btn-sm" onclick="flipFlashcard()">'+(flashcardFlipped?'看正面':'看背面')+'</button>'+
    '<button class="btn btn-outline btn-sm" onclick="nextFlashcard()" '+(flashcardIndex===total-1?'disabled style="opacity:.4"':'')+' style="font-size:1.2rem">下一张 ▶</button>'+
    '</div></div>'+

    '<div class="card"><div class="card-title"><div class="card-title-left">学习进度</div></div>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap">'+
    '<div style="text-align:center;flex:1;min-width:80px"><div style="font-size:1.8rem;font-weight:700;color:var(--lavender)">'+(flashcardIndex+1)+'</div><div style="font-size:.72rem;color:var(--muted)">今日进度</div></div>'+

    '<div style="text-align:center;flex:1;min-width:80px"><div style="font-size:1.8rem;font-weight:700;color:var(--peach)">'+allTimeLearned+'</div><div style="font-size:.72rem;color:var(--muted)">累计打卡</div></div>'+
    '</div>'+
    '<div style="margin-top:14px;text-align:center">'+
    (flashcardIndex>=total-1?
      (learnedToday?
        '<div style="color:var(--mint);font-weight:600;padding:8px">今日已完成全部闪卡并打卡 ✓</div>':
        '<button class="btn btn-primary" onclick="checkinJapanese()">完成学习并打卡</button>'

    )+'</div></div>'+

    '<div class="card"><div class="card-title"><div class="card-title-left">今日词库 ('+total+')</div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">'+
    cards.all.map((card,i)=>'<div style="padding:8px 10px;background:'+(i===flashcardIndex?'var(--lavender-bg)':'var(--bg)')+';border-radius:8px;font-size:.78rem;cursor:pointer" onclick="jumpFlashcard('+i+')"><div style="font-weight:600">'+card.word+'</div><div style="color:var(--muted);font-size:.7rem">'+card.meaning+'</div></div>').join('')+

function flipFlashcard(){flashcardFlipped=!flashcardFlipped;renderContent()}
function nextFlashcard(){if(flashcardIndex<getTodayCards().all.length-1){flashcardIndex++;flashcardFlipped=false;renderContent()}}
function prevFlashcard(){if(flashcardIndex>0){flashcardIndex--;flashcardFlipped=false;renderContent()}}
function jumpFlashcard(i){flashcardIndex=i;flashcardFlipped=false;renderContent()}
function checkinJapanese(){
  const d=today();
  if(Store.data.checkinRecords.find(r=>r.type==='japanese'&&r.date===d)){toast('今日已打卡');return}
  Store.data.checkinRecords.push({id:genId(),type:'japanese',date:d,value:true,count:getTodayCards().all.length});
  Store.save();renderContent();toast('日语学习打卡成功！');
}

// ====== Reading ======
async function renderReading(c){
  const recs=Store.data.bookRecommends||[];
  const todayRec=recs.find(r=>r.date===today());
  const history=recs.filter(r=>r.date!==today()).sort((a,b)=>b.date.localeCompare(a.date));

  // Get today's book
  let book=null;
  if(todayRec){book=todayRec.book}
  else{
    // Try API first, fallback to bookBank
    book=await fetchBookFromAPI().catch(()=>null);
    if(!book){
      const seed=parseInt(today().replace(/-/g,''));
      const rng=seededRandom(seed);
      book=bookBank[Math.floor(rng()*bookBank.length)];
    }
    // Save as today's recommendation
    Store.data.bookRecommends.push({id:genId(),date:today(),book,feedback:''});
    Store.save();
  }

  c.innerHTML=
    '<div class="card" style="background:linear-gradient(135deg,var(--mint-bg),var(--sky-bg))"><div class="card-title"><div class="card-title-left">每日好书推荐 <span class="badge badge-mint">'+today()+'</span></div></div>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap">'+
    (book.cover?'<img src="'+book.cover+'" style="width:100px;height:140px;border-radius:8px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.1)" onerror="this.style.display=\'none\'">':'')+
    '<div style="flex:1;min-width:200px">'+
    '<div style="font-size:1.1rem;font-weight:700;margin-bottom:4px">'+book.title+'</div>'+
    '<div style="font-size:.82rem;color:var(--muted);margin-bottom:8px">'+book.author+'</div>'+
    '<div style="font-size:.85rem;line-height:1.6">'+book.summary+'</div>'+
    '</div></div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
    (todayRec&&todayRec.feedback?
      '<div style="flex:1;text-align:center;padding:10px;background:var(--card);border-radius:12px;font-size:.85rem;font-weight:600;color:'+(todayRec.feedback==='想读'?'var(--mint)':'var(--muted)')+'">'+(todayRec.feedback==='想读'?'✓ 已标记想读':'已跳过')+'</div>':
      '<button class="btn btn-primary btn-sm" style="flex:1" onclick="rateBook(\'想读\')">📖 想读</button><button class="btn btn-outline btn-sm" style="flex:1" onclick="rateBook(\'不感兴趣\')">不感兴趣</button>'
    )+
    '</div></div>'+

    '<div class="card"><div class="card-title"><div class="card-title-left">历史推荐 ('+history.length+')</div></div>'+
    (history.length?history.slice(0,10).map(r=>'<div class="task-row"><div style="width:30px;height:40px;border-radius:4px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--muted);flex-shrink:0">'+(r.book.cover?'📖':'📕')+'</div><div class="task-title">'+r.book.title+'<div style="font-size:.72rem;color:var(--muted)">'+r.book.author+'</div></div><span class="badge '+(r.feedback==='想读'?'badge-mint':'badge-soft')+'">'+(r.feedback||'未反馈')+'</span></div>').join(''):'<div style="color:var(--muted);text-align:center;padding:16px">暂无历史推荐</div>')+
    '</div>'+

    '<div class="card"><div class="card-title"><div class="card-title-left">内置书库 ('+bookBank.length+'本)</div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">'+
    bookBank.map(b=>'<div style="padding:10px;background:var(--bg);border-radius:8px;font-size:.78rem;cursor:pointer" onclick="recommendBook(\''+b.title.replace(/'/g,'\\\'')+'\')"><div style="font-weight:600;margin-bottom:2px">'+b.title+'</div><div style="color:var(--muted);font-size:.7rem">'+b.author+'</div></div>').join('')+
    '</div></div>';
}

async function fetchBookFromAPI(){
  try{
    const r=await fetch('https://weread.qq.com/web/search/global?query=&size=1');
    const d=await r.json();
    if(d&&d.books&&d.books[0]){
      const b=d.books[0];
      return{title:b.title,author:b.author,cover:b.cover,summary:b.intro||b.summary||'暂无简介'};
    }
    return null;
  }catch(e){return null}
}

function rateBook(feedback){
  const rec=Store.data.bookRecommends.find(r=>r.date===today());
  if(rec){rec.feedback=feedback;Store.save();renderContent();toast(feedback==='想读'?'已加入想读清单':'已记录反馈')}
}

function recommendBook(title){
  const book=bookBank.find(b=>b.title===title);
  if(!book)return;
  // Replace today's recommendation
  const idx=Store.data.bookRecommends.findIndex(r=>r.date===today());
  if(idx>=0){Store.data.bookRecommends[idx].book=book;Store.data.bookRecommends[idx].feedback=''}
  else{Store.data.bookRecommends.push({id:genId(),date:today(),book,feedback:''})}
  Store.save();renderContent();toast('已切换推荐');
}

// ====== Actions ======
function addTask(){
  const inp=document.getElementById('task-title');if(!inp)return;
  const title=inp.value.trim();if(!title)return;
  const module=taskTab==='work'?'工作':'生活';
  Store.data.tasks.push({id:genId(),title,module,priority:'中',dueDate:'',notes:'',completed:false,completedAt:'',createdAt:today()});
  inp.value='';Store.save();renderContent();toast('已添加');
}
function toggleTask(id){
  const t=Store.data.tasks.find(x=>x.id===id);if(!t)return;
  t.completed=!t.completed;t.completedAt=t.completed?today():'';
  Store.save();renderContent();
}
function deleteTask(id){Store.data.tasks=Store.data.tasks.filter(x=>x.id!==id);Store.save();renderContent()}

function addInsp(){
  const title=document.getElementById('insp-title')?.value.trim();if(!title)return;
  let category=document.getElementById('insp-category')?.value||'工作';
  if(category==='自定义'){
    category=document.getElementById('insp-custom-cat')?.value.trim()||'通用';
  }
  Store.data.inspirations.push({id:genId(),title,category,status:'未整理',splitStatus:'未拆解',linkedTaskId:'',tags:[],createdAt:today()});
  document.getElementById('insp-title').value='';Store.save();renderContent();toast('灵感已记录');
}
function toggleInspStatus(id){
  const i=Store.data.inspirations.find(x=>x.id===id);if(!i)return;
  i.status=i.status==='未整理'?'已整理':'未整理';Store.save();renderContent();
}
function deleteInsp(id){Store.data.inspirations=Store.data.inspirations.filter(x=>x.id!==id);Store.save();renderContent()}

function splitInspModal(id){
  const insp=Store.data.inspirations.find(x=>x.id===id);if(!insp)return;
  document.getElementById('modal-body').innerHTML='<h3>拆解灵感：'+insp.title+'</h3>'+
    '<div style="margin-bottom:10px;font-size:.8rem;color:var(--muted)">每行输入一个子任务，将批量创建待办（分类：'+(insp.category||'通用')+'，优先级：中，截止日：3天后）</div>'+
    '<div class="modal-field"><textarea id="split-tasks" placeholder="子任务1\n子任务2\n子任务3" style="min-height:140px"></textarea></div>'+
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doSplitInsp(\''+id+'\')">批量拆解</button></div>';
  document.getElementById('modal-overlay').classList.add('show');
}

function doSplitInsp(id){
  const insp=Store.data.inspirations.find(x=>x.id===id);if(!insp)return;
  const text=document.getElementById('split-tasks')?.value.trim();
  if(!text){toast('请输入子任务');return}
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  if(!lines.length){toast('请输入子任务');return}
  const moduleMap={工作:'工作',生活:'生活',创意:'工作',运营:'工作',学习:'生活'};
  const module=moduleMap[insp.category]||'工作';
  const dueDate=addDays(3);
  lines.forEach(title=>{
    Store.data.tasks.push({id:genId(),title,module,priority:'中',dueDate,notes:'来源灵感: '+insp.title,completed:false,completedAt:'',createdAt:today()});
  });
  insp.splitStatus='已拆解';
  closeModal();Store.save();renderContent();toast('已拆解 '+lines.length+' 个子任务');
}

function addStudy(subject){
  const title=document.getElementById('study-title')?.value.trim();if(!title)return;
  Store.data.study.push({id:genId(),title,subject,category:document.getElementById('study-cat')?.value||'词汇',content:'',tags:[],progress:0,createdAt:today(),updatedAt:today()});

}

function saveStudy(){const d=Store.data.study.find(x=>x.id===editId);if(!d)return;d.title=document.getElementById('me-sn-title').value;d.content=document.getElementById('me-sn-content').value;d.updatedAt=today();closeModal();Store.save();renderContent()}

function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
let editId=null;

// ====== AI ======
function runAI(){
  const inp=document.getElementById('ai-input'),q=inp.value.trim();if(!q){toggleAI();return}inp.value='';
  const body=document.getElementById('ai-body');let resp='好的鸭~';
  if(q.includes('添加')){addTask();resp='已添加待办'}
  else if(q.includes('打卡')||q.includes('健康')){navigate('home');resp='已打开总览'}
  else if(q.includes('日历')||q.includes('历史')){navigate('home','calendar');resp='已打开日历'}
  else if(q.includes('看看')||q.includes('进度')){navigate('home');resp='已打开总览'}
  else if(q.includes('日语')||q.includes('闪卡')){navigate('study','japanese');resp='已打开日语闪卡'}
  else if(q.includes('读书')||q.includes('书')){navigate('study','reading');resp='已打开读书推荐'}
  else if(q.includes('排期')||q.includes('日历排期')){navigate('revenue','schedule');resp='已打开排期日历'}
  else if(q.includes('笔记')){navigate('revenue','notes');resp='已打开笔记管理'}
  else if(q.includes('资料')){navigate('revenue','vdata');resp='已打开虚拟资料'}
  else if(q.includes('灵感')){navigate('tasks','insp');resp='已打开灵感库'}
  else resp='需要大模型协助，配个API Key哦~';
  body.innerHTML='<div style="padding:8px;background:var(--peach-bg);border-radius:8px;margin-bottom:6px">'+resp+'</div>'+body.innerHTML;
}

// ====== Login ======
async function doLogin(){
  const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value,e=document.getElementById('login-err');
  if(!u||!p){e.textContent='请输入用户名和密码';return}
  e.textContent='加载中...';
  await loadSDK();
  if(typeof cloudbase==='undefined'){e.textContent='SDK加载失败，请刷新';return}
  try{
    Store.credentials={username:u,password:p};
    await Store.initCloud();
    localStorage.setItem('ws_logged','1');
    localStorage.setItem('ws_user',u);
    localStorage.setItem('ws_pass',p);
    document.getElementById('login-overlay').style.display='none';
    buildUI();
  }catch(ex){
    e.textContent='登录失败: '+(ex.message||'请检查用户名密码');
  }
}
(async function init(){
  let loggedIn=false;
  try{loggedIn=localStorage.getItem('ws_logged')==='1'}catch(e){}
  if(!loggedIn)return;
  Store.credentials={
    username:localStorage.getItem('ws_user')||'admin',
    password:localStorage.getItem('ws_pass')||'Admin123'
  };
  document.getElementById('login-overlay').style.display='none';
  Store.loadLocal();
  try{await Store.initCloud()}catch(ex){
    document.getElementById('login-overlay').style.display='flex';
    document.getElementById('login-err').textContent='连接失败: '+(ex.message||'请刷新重试');
    return;
  }
  buildUI();
})();
