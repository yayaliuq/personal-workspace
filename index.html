<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFE0CC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>个人工作台</title>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ====== 治愈系设计系统 ====== */
:root {
  --bg: #FBF6EE;
  --bg-soft: #F5EBDC;
  --card: #FFFFFF;
  --card-warm: #FFF8EE;
  --text: #5C4D3A;
  --text-soft: #97876E;
  --border: #F0E5D2;

  --peach: #F4A78B;        --peach-bg: #FCE8DC;
  --mint: #88C9A1;         --mint-bg: #DDF1E5;
  --lavender: #B8A0D9;     --lavender-bg: #EBE3F4;
  --sky: #88B8DD;          --sky-bg: #D9E6F2;
  --coral: #F47B5E;        --coral-bg: #FCDDD3;
  --butter: #E8C57A;       --butter-bg: #FBEFCF;
  --rose: #E89CB0;         --rose-bg: #F8DDE5;

  --radius: 18px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow: 0 2px 8px rgba(180,140,90,.06), 0 1px 3px rgba(180,140,90,.04);
  --shadow-md: 0 4px 16px rgba(180,140,90,.08);
  --sidebar-w: 200px;

  --font: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:.9rem}
input,textarea,select{font-family:inherit;font-size:.9rem;color:var(--text);outline:none}
a{color:var(--peach);text-decoration:none}
ul{list-style:none}

/* ====== Layout ====== */
#app{display:flex;min-height:100vh}

/* ====== Sidebar (Mac) - 奶油色 ====== */
#sidebar{width:var(--sidebar-w);background:var(--card-warm);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;border-right:1px solid var(--border)}
.sidebar-top{padding:24px 20px 16px}
.sidebar-top h1{font-size:1.05rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.sidebar-top .sub{font-size:.7rem;color:var(--text-soft);margin-top:4px}
.sidebar-nav{flex:1;padding:8px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-xs);margin-bottom:2px;font-size:.85rem;color:var(--text-soft);transition:all .15s;width:100%;text-align:left;font-weight:500}
.nav-item:hover{background:var(--bg-soft);color:var(--text)}
.nav-item.active{background:var(--coral);color:#fff;font-weight:600}
.nav-item .icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0;font-weight:700}
.nav-item .badge{min-width:20px;height:20px;padding:0 6px;background:var(--coral);color:#fff;font-size:.65rem;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:auto}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:.7rem;color:var(--text-soft)}
.sidebar-footer .status-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sidebar-footer .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-footer .dot.on{background:var(--mint)}
.sidebar-footer .dot.off{background:#E89380}

#main{flex:1;margin-left:var(--sidebar-w);padding:18px 24px 60px;max-width:1080px}

/* ====== Top bar (iPhone) ====== */
#topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:var(--card-warm);color:var(--text);padding:12px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
#topbar h1{font-size:1rem;font-weight:700}
#topbar .menu-btn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--text)}

/* ====== Bottom nav (iPhone) ====== */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:99;background:#fff;padding:8px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 12px rgba(180,140,90,.06);justify-content:space-around;align-items:center}
#bottom-nav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:.62rem;color:var(--text-soft);min-height:50px;justify-content:center;font-weight:500}
#bottom-nav .bn-item.active{color:var(--coral);font-weight:700}
#bottom-nav .bn-item .icon{font-size:1.3rem;font-weight:700}
#bottom-nav .bn-fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--peach));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:300;margin-top:-22px;box-shadow:0 4px 12px rgba(244,123,94,.4);flex-shrink:0;line-height:1}

/* ====== AI Bar (Mac) ====== */
.ai-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.ai-bar input{flex:1;padding:11px 18px;border:1.5px solid var(--border);border-radius:24px;background:var(--card);font-size:.9rem;color:var(--text);transition:all .15s}
.ai-bar input::placeholder{color:var(--text-soft)}
.ai-bar input:focus{border-color:var(--peach);box-shadow:0 0 0 4px rgba(244,167,139,.1)}
.ai-bar .ai-send{padding:11px 22px;border-radius:24px;background:var(--coral);color:#fff;font-weight:600;font-size:.85rem}
.ai-msg{padding:10px 16px;background:var(--peach-bg);border-radius:var(--radius-sm);font-size:.8rem;color:var(--text);display:none;margin-bottom:12px;border:1px solid var(--peach)33}

/* ====== Hero Greeting Card ====== */
.hero{background:linear-gradient(135deg,var(--peach-bg),var(--butter-bg));border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(244,167,139,.15)}
.hero-left h2{font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3}
.hero-left .greeting-desc{font-size:.82rem;color:var(--text-soft)}
.hero-right{font-size:2rem;font-weight:300;color:var(--peach);line-height:1}

/* ====== Cards Common ====== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.card-soft{background:var(--card-warm)}
.card-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-title-left{display:flex;align-items:center;gap:8px}

.page-header{margin-bottom:14px}
.page-header h2{font-size:1.25rem;font-weight:700;color:var(--text)}
.page-header .desc{font-size:.8rem;color:var(--text-soft);margin-top:3px}

.btn{padding:9px 18px;border-radius:24px;font-size:.85rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--coral);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-yellow{background:var(--butter);color:#fff}
.btn-ghost{background:var(--bg-soft);color:var(--text-soft)}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{color:var(--coral);background:var(--coral-bg)}
.btn-xs{padding:4px 12px;font-size:.72rem}
.btn-sm{padding:7px 14px;font-size:.8rem}

/* ====== Circular Progress (今日概览) ====== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat-circle{background:var(--card);border-radius:var(--radius);padding:16px 10px;text-align:center;border:1px solid var(--border)}
.circle-wrap{position:relative;width:64px;height:64px;margin:0 auto 8px}
.circle-wrap svg{transform:rotate(-90deg)}
.circle-wrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;color:var(--text)}
.stat-circle .stat-name{font-size:.75rem;color:var(--text-soft);margin-bottom:2px;font-weight:600}
.stat-circle .stat-val{font-size:.7rem;color:var(--text)}

/* ====== Filter Tabs ====== */
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-tab{padding:6px 14px;border-radius:16px;font-size:.78rem;font-weight:500;background:var(--card);color:var(--text-soft);border:1px solid var(--border);white-space:nowrap;transition:all .15s}
.filter-tab:hover{border-color:var(--peach);color:var(--peach)}
.filter-tab.active{background:var(--peach);color:#fff;border-color:var(--peach)}
.filter-tab .count{font-size:.65rem;opacity:.8;margin-left:3px}

/* ====== Tasks ====== */
.add-bar{display:flex;gap:8px;margin-bottom:14px}
.add-bar input{flex:1;padding:11px 16px;border:1px solid var(--border);border-radius:24px;background:var(--card)}
.add-bar input:focus{border-color:var(--peach)}
.add-bar select{padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card)}

.task-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);margin-bottom:8px;transition:all .15s}
.task-card:hover{border-color:var(--peach);box-shadow:var(--shadow)}
.task-card.done{opacity:.5}
.task-card.done .task-title{text-decoration:line-through}
.task-cb{width:22px;height:22px;border:2px solid var(--border);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;transition:all .15s}
.task-cb.checked{background:var(--mint);border-color:var(--mint);color:#fff}
.task-body{flex:1;min-width:0}
.task-title{font-size:.88rem;font-weight:500;color:var(--text)}
.task-meta{display:flex;gap:6px;margin-top:3px;font-size:.7rem;flex-wrap:wrap}
.task-actions{display:flex;gap:2px}
.task-actions button{font-size:.8rem;padding:4px 6px;color:var(--text-soft);border-radius:6px}
.task-actions button:hover{background:var(--bg-soft)}

.badge-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:600}
.badge-peach{background:var(--peach-bg);color:#A8604A}
.badge-mint{background:var(--mint-bg);color:#3E8E66}
.badge-lavender{background:var(--lavender-bg);color:#6B4F8C}
.badge-sky{background:var(--sky-bg);color:#3F6F95}
.badge-coral{background:var(--coral-bg);color:#C45A3F}
.badge-butter{background:var(--butter-bg);color:#A07A2D}
.badge-rose{background:var(--rose-bg);color:#B25A75}
.badge-soft{background:var(--bg-soft);color:var(--text-soft)}

/* ====== XHS Kanban ====== */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kanban-col{background:var(--card-warm);border-radius:var(--radius-sm);padding:10px;min-height:140px;border:1px solid var(--border)}
.kanban-col .col-hd{font-size:.75rem;font-weight:700;color:var(--text-soft);margin-bottom:8px;display:flex;align-items:center;gap:4px;justify-content:space-between}
.kanban-col .col-count{background:var(--peach);color:#fff;font-size:.62rem;padding:1px 7px;border-radius:10px;font-weight:600}
.kanban-card{padding:8px 10px;background:var(--card);border-radius:var(--radius-xs);margin-bottom:6px;font-size:.78rem;cursor:pointer;border:1px solid transparent;transition:all .15s}
.kanban-card:hover{border-color:var(--peach);box-shadow:var(--shadow)}
.kanban-add{font-size:.72rem;color:var(--peach);cursor:pointer;padding:6px;text-align:center;border-radius:var(--radius-xs);border:1px dashed var(--border)}
.kanban-add:hover{background:var(--peach-bg)}

/* ====== News Cards ====== */
.news-card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);margin-bottom:8px;transition:all .15s}
.news-card:hover{border-color:var(--peach)}
.news-title{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:4px}
.news-summary{font-size:.78rem;color:var(--text-soft);margin-bottom:8px;line-height:1.5}
.news-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.news-footer{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--text-soft)}

/* ====== Health ====== */
.chart-wrap{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-bottom:14px;height:240px}
.health-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85rem;color:var(--text)}
.health-row:last-child{border-bottom:none}
.health-row .hr-date{min-width:70px;color:var(--text-soft);font-size:.78rem}
.health-row .hr-weight{font-weight:600;color:var(--peach);min-width:60px}

/* ====== Notes & Inspiration ====== */
.note-card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);margin-bottom:8px;cursor:pointer;transition:all .15s}
.note-card:hover{border-color:var(--peach)}
.note-card .note-title{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:4px}
.note-card .note-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note-card .note-preview{font-size:.78rem;color:var(--text-soft);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.insp-quick{display:flex;gap:8px;margin-bottom:14px}
.insp-quick input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:24px;background:var(--card)}
.insp-quick input:focus{border-color:var(--butter)}
.insp-card{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
.insp-card .insp-body{flex:1}
.insp-card .insp-title{font-size:.88rem;font-weight:500;color:var(--text)}
.insp-card .insp-meta{font-size:.7rem;color:var(--text-soft);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}

/* ====== Modal ====== */
#modal-overlay{position:fixed;inset:0;background:rgba(60,40,20,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(180,140,90,.2)}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:.75rem;color:var(--text-soft);margin-bottom:5px;font-weight:600}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card-warm);color:var(--text)}
.modal-field input:focus,.modal-field textarea:focus{border-color:var(--peach)}
.modal-field textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* ====== Toast ====== */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(80,60,40,.92);color:#fff;padding:10px 24px;border-radius:24px;font-size:.8rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ====== Login ====== */
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--peach-bg),var(--butter-bg),var(--lavender-bg));z-index:9999;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--card);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow-md);width:340px;max-width:90vw;border:1px solid var(--border)}
.login-card h2{font-size:1.2rem;margin-bottom:4px;text-align:center;color:var(--text);font-weight:700}
.login-card .sub{font-size:.75rem;color:var(--text-soft);text-align:center;margin-bottom:22px}
.login-card .field{margin-bottom:14px}
.login-card .field label{display:block;font-size:.75rem;color:var(--text-soft);margin-bottom:4px;font-weight:600}
.login-card .field input{width:100%;padding:11px 16px;border:1px solid var(--border);border-radius:24px;font-size:.95rem;background:var(--card-warm)}
.login-card .field input:focus{border-color:var(--peach)}
.login-card .err{font-size:.7rem;color:var(--coral);margin-top:4px;min-height:18px}
.login-card .btn-full{width:100%;padding:13px;background:var(--coral);color:#fff;border-radius:24px;font-size:.95rem;font-weight:700;margin-top:6px}
.login-card .btn-full:disabled{opacity:.5}

/* ====== iPhone 专属布局 ====== */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);width:280px;padding-top:env(safe-area-inset-top,0);box-shadow:0 0 30px rgba(180,140,90,.2)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding:60px 14px 100px}
  #topbar{display:flex;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0))}
  #topbar .menu-btn{font-size:1.4rem;color:var(--text)}
  #bottom-nav{display:flex}

  /* Hero */
  .hero{padding:16px 18px;margin-bottom:12px}
  .hero-left h2{font-size:1.15rem}
  .hero-right{font-size:1.6rem}

  /* Stats */
  .stats-row{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat-circle{padding:12px 4px}
  .circle-wrap{width:48px;height:48px}
  .stat-circle .stat-name{font-size:.65rem}
  .stat-circle .stat-val{font-size:.62rem}

  /* Cards */
  .card{padding:14px;margin-bottom:10px;border-radius:var(--radius-sm)}
  .page-header h2{font-size:1.1rem}
  .btn{padding:8px 14px;font-size:.8rem;min-height:42px}

  /* Tasks */
  .task-card{padding:10px 12px;border-radius:14px}
  .task-cb{min-width:24px;min-height:24px}
  .task-actions{opacity:1}

  /* Kanban 2 columns */
  .kanban{grid-template-columns:repeat(2,1fr);gap:8px}

  /* AI bar fixed at bottom */
  .ai-bar{position:fixed;left:12px;right:12px;bottom:78px;z-index:50;margin-bottom:0;background:var(--card);padding:6px;border-radius:24px;box-shadow:0 4px 16px rgba(180,140,90,.12)}
  .ai-bar input{border:none;background:transparent}
  .ai-bar .ai-send{padding:8px 16px;font-size:.78rem}
  .ai-msg{position:fixed;left:12px;right:12px;bottom:140px;z-index:49;background:var(--card);border-radius:14px;box-shadow:var(--shadow-md);padding:10px 14px;margin-bottom:0}

  /* Chart */
  .chart-wrap{height:200px;padding:10px}

  /* Filter */
  .filter-tab{padding:5px 12px;font-size:.72rem}
  .add-bar input,.add-bar select{padding:11px 14px;font-size:16px}

  /* Modal */
  #modal-overlay{align-items:flex-end}
  .modal{max-width:100%;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));max-height:78vh}

  /* Toast */
  #toast{bottom:160px}
}
</style>
</head>
<body>
<div id="app">

<!-- Login -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>个人工作台</h2>
    <div class="sub">愿你稳步向理想的自己靠近</div>
    <div class="field"><label>用户名</label><input id="login-user" placeholder="admin" value="admin"></div>
    <div class="field"><label>密码</label><input id="login-pass" type="password" placeholder="Admin123" value="Admin123"></div>
    <div class="err" id="login-err"></div>
    <button class="btn-full" onclick="doLogin()">进入工作台</button>
  </div>
</div>

<!-- Top bar (iPhone) -->
<div id="topbar"><button class="menu-btn" onclick="toggleSidebar()">三</button><h1>个人工作台</h1><div style="min-width:44px"></div></div>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="sidebar-top"><h1>个人工作台</h1><div class="sub">v5.0 治愈版</div></div>
  <div class="sidebar-nav" id="sidebar-nav"></div>
  <div class="sidebar-footer">
    <div class="status-row"><span class="dot off" id="cloud-dot"></span><span id="cloud-text">连接中...</span></div>
    <div id="last-sync"></div>
  </div>
</nav>

<!-- Main -->
<main id="main">
<!-- Page: Home (今日概览) -->
<div id="pg-home" class="page" style="display:none">
  <div class="hero"><div class="hero-left" style="flex:1"><h2 id="hero-greet">你好呀</h2><div class="greeting-desc" id="hero-quote"></div></div><div class="hero-right" style="text-align:right"><div id="hero-time" style="font-size:.8rem;color:var(--text-soft);margin-bottom:2px">--:--</div><div id="hero-weather" style="font-size:.75rem;color:var(--peach);display:flex;align-items:center;gap:4px;justify-content:flex-end">加载中...</div></div></div>

<script>
// ============================================================
// Data Store
// ============================================================
const Store = {
  data: { tasks: [], study_notes: [], finance_news: [], health_records: [], xhs_content: [], hot_topics: [], inspirations: [] },
  envId: 'yayaliu-d4g1i1dc2fdb04417',
  app: null, auth: null, db: null, ready: false, cloudOk: false,
  _hadSyncBefore: false, _syncTimer: null,
  async initCloud() {
    try {
      if (typeof cloudbase === 'undefined') throw new Error('SDK未加载');
      const app = cloudbase.init({ env: this.envId });
      let ls; try { ls = await app.auth.getLoginState(); } catch(e){}
      if (!ls) {
        const { error } = await app.auth.signInWithPassword({ username: 'admin', password: 'Admin123' });
        if (error) throw new Error(error.message || '登录失败');
      }
      this.auth = app.auth; this.app = app; this.db = app.database(); this.ready = true;
      this.updateStatus('connecting');
      await this.loadFromCloud();
      this.cloudOk = true; this.updateStatus('cloud');
      return true;
    } catch(e) {
      this.ready = false; this.cloudOk = false; this.updateStatus('offline');
      toast('连接失败: ' + (e.message || ''));
      return false;
    }
  },
  async loadFromCloud() {
    if (!this.ready || !this.db) return;
    const dedup = (arr, key='id') => { const s=new Set(); return arr.filter(x=>{ const v=x[key]||''; if(s.has(v)) return false; s.add(v); return true; }); };
    const strip = (d) => { const {_id,_openid,createdAt,updatedAt,...r}=d; return r; };
    const sg = async (col) => { try { const r=await this.db.collection(col).limit(1000).get(); return (r.data||[]).map(strip); } catch(e){ return []; } };
    const ct = dedup(await sg('tasks'));
    const sn = dedup(await sg('study_notes'));
    const fn = await sg('finance_news');
    const hr = dedup(await sg('health_records'));
    const xc = dedup(await sg('xiaohongshu'));
    const ht = dedup(await sg('hot_topics'));
    const ins = dedup(await sg('inspirations'));
    let hasCloud = false;
    if (ct.length) { this.data.tasks = ct; hasCloud = true; }
    if (sn.length) { this.data.study_notes = sn; hasCloud = true; }
    if (fn.length) { this.data.finance_news = fn; hasCloud = true; }
    if (hr.length) { this.data.health_records = hr; hasCloud = true; }
    if (xc.length) { this.data.xhs_content = xc; hasCloud = true; }
    if (ht.length) { this.data.hot_topics = ht; hasCloud = true; }
    if (ins.length) { this.data.inspirations = ins; hasCloud = true; }
    if (hasCloud) { this.saveLocal(); this.updateSyncTime(); }
    else if (this._hadSyncBefore) { this.data.tasks=[]; this.data.finance_news=[]; this.data.health_records=[]; this.data.xhs_content=[]; this.data.hot_topics=[]; this.data.inspirations=[]; this.saveLocal(); }
    else if (this.data.tasks.length||this.data.study_notes.length) { await this.saveToCloud(); }
  },
  async saveToCloud() {
    if (!this.ready || !this.db) return;
    const repl = async (col, items) => {
      const ex = await col.limit(1000).get();
      for (const d of ex.data||[]) try { await col.doc(d._id).remove(); } catch(e){}
      for (const i of items) await col.add({...i});
    };
    try { await repl(this.db.collection('tasks'),this.data.tasks); } catch(e){}
    try { await repl(this.db.collection('study_notes'),this.data.study_notes); } catch(e){}
    try { await repl(this.db.collection('finance_news'),this.data.finance_news); } catch(e){}
    try { await repl(this.db.collection('health_records'),this.data.health_records); } catch(e){}
    try { await repl(this.db.collection('xiaohongshu'),this.data.xhs_content); } catch(e){}
    try { await repl(this.db.collection('hot_topics'),this.data.hot_topics); } catch(e){}
    try { await repl(this.db.collection('inspirations'),this.data.inspirations); } catch(e){}
    this.updateSyncTime(); this.updateStatus('cloud');
  },
  loadLocal() {
    try {
      const r = localStorage.getItem('ws_data');
      if (r) { const p=JSON.parse(r); this.data = Object.assign(this.data, p); }
      this._hadSyncBefore = localStorage.getItem('ws_hadsync')==='1';
    } catch(e) {}
  },
  saveLocal() { localStorage.setItem('ws_data', JSON.stringify(this.data)); },
  async save() { this.saveLocal(); clearTimeout(this._syncTimer); this._syncTimer = setTimeout(()=>this.saveToCloud(),500); },
  updateStatus(s) {
    const d=document.getElementById('cloud-dot'),t=document.getElementById('cloud-text');
    if (s==='cloud') { d.classList.add('on'); d.classList.remove('off'); t.textContent='已连接'; }
    else if (s==='connecting') { d.classList.add('on'); d.classList.remove('off'); t.textContent='连接中...'; }
    else { d.classList.add('off'); d.classList.remove('on'); t.textContent='离线'; }
  },
  updateSyncTime() {
    const n=new Date(),el=document.getElementById('last-sync');
    if(el) el.textContent='同步 '+n.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    this._hadSyncBefore=true; localStorage.setItem('ws_hadsync','1');
  }
};

const genId = () => 'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);

function toast(msg) { const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2000); }

let currentPage = 'home', currentModal = null, editId = null;
let taskFilter = '全部', financeFilter = '全部', studyFilter = '全部', inspFilter = '全部', xhsTab = 'content';

// ============================================================
// Navigation
// ============================================================
const pages = [
  {id:'home', icon:'居', label:'首页'},
  {id:'tasks', icon:'办', label:'待办'},
  {id:'finance', icon:'财', label:'财经'},
  {id:'health', icon:'健', label:'健康'},
  {id:'xhs', icon:'书', label:'小红书'},
  {id:'study', icon:'学', label:'学习'},
  {id:'insp', icon:'光', label:'灵感'},
];

function navigate(id) {
  currentPage = id;
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById('pg-'+id).style.display='block';
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('.nav-item[data-page="'+id+'"]')?.classList.add('active');
  document.querySelectorAll('.bn-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('.bn-item[data-page="'+id+'"]')?.classList.add('active');
  if (id==='home') renderHome();
  if (id==='tasks') renderTasks();
  if (id==='finance') renderFinance();
  if (id==='health') renderHealth();
  if (id==='xhs') renderXHS();
  if (id==='study') renderStudy();
  if (id==='insp') renderInsp();
  if (window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function buildNav() {
  let h=''; let b='';
  pages.slice(0,4).forEach(p=>{
    h+=`<button class="nav-item" data-page="${p.id}" onclick="navigate('${p.id}')"><span class="icon">${p.icon}</span>${p.label}</button>`;
    b+=`<button class="bn-item" data-page="${p.id}" onclick="navigate('${p.id}')"><span class="icon">${p.icon}</span>${p.label}</button>`;
  });
  // sidebar - rest of items
  h+='<div style="height:8px;border-top:1px solid var(--border);margin:8px 0"></div>';
  pages.slice(4).forEach(p=>{
    h+=`<button class="nav-item" data-page="${p.id}" onclick="navigate('${p.id}')"><span class="icon">${p.icon}</span>${p.label}</button>`;
  });
  // bottom nav - center FAB
  b+=`<button class="bn-fab" onclick="navigate('insp')">+</button>`;
  b+=`<button class="bn-item" data-page="xhs" onclick="navigate('xhs')"><span class="icon">${pages[4].icon}</span>${pages[4].label}</button>`;
  b+=`<button class="bn-item" data-page="study" onclick="navigate('study')"><span class="icon">${pages[5].icon}</span>${pages[5].label}</button>`;
  b+=`<button class="bn-item" data-page="more" onclick="toggleSidebar()"><span class="icon">+</span>更多</button>`;
  document.getElementById('sidebar-nav').innerHTML = h;
  document.getElementById('bottom-nav').innerHTML = b;
  navigate('home');
}

// ============================================================
// Home Dashboard
// ============================================================
let homeChart = null;

async function fetchWeather() {
  try {
    const resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.26&longitude=108.94&current=temperature_2m,weather_code&timezone=Asia/Shanghai');
    const data = await resp.json();
    const t = data.current.temperature_2m;
    const code = data.current.weather_code;
    const icons = {0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',51:'小雨',53:'中雨',61:'阵雨',71:'小雪',80:'雷雨'};
    const w = icons[code] || '多云';
    return Math.round(t)+' '+w;
  } catch(e) { return '西安'; }
}

async function renderHome() {
  const h = new Date().getHours();
  let greet = '早上好呀';
  if (h >= 12 && h < 18) greet = '下午好';
  else if (h >= 18) greet = '晚上好';
  document.getElementById('hero-greet').textContent = greet;
  document.getElementById('hero-time').textContent = new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short'});
  const quotes=["今天也是闪闪发光的一天","你比想象中更强大","每一步都算数","慢慢来，比较快","阳光正好，继续前行","别怕，你正在变好的路上","今天也是值得的一天","保持热爱，奔赴山海","做自己的小太阳","认真生活的你最可爱","慢慢变好，是给自己最好的礼物","今天的努力是明天的底气"];
  document.getElementById('hero-quote').textContent=quotes[Math.floor(Math.random()*quotes.length)];
  // Weather
  fetchWeather().then(w=>{ document.getElementById('hero-weather').textContent = w; });

  const tasks=Store.data.tasks,recs=Store.data.health_records,studies=Store.data.study_notes,inspirations=Store.data.inspirations;
  const todayStr=(new Date()).toISOString().slice(0,10);
  
  // === 今日数据 ===
  const todayHealth = recs.filter(r=>r.date===todayStr);
  const todayWeight = todayHealth.find(r=>r.weight)?.weight || 0;
  const todayCals = todayHealth.reduce((s,r)=>s+(r.calories||0),0);
  const todayTrain = todayHealth.filter(r=>r.training&&r.training!=='休息').length;
  const todayInsp = inspirations.filter(i=>i.createdAt===todayStr).length;

  const mk=(val,unit,color)=>`<div class="stat-circle" style="color:${color}"><div class="pct" style="font-size:1.2rem">${val||'--'}</div><div class="stat-name">${unit}</div><div class="stat-val">今日</div></div>`;
  document.getElementById('home-stats').innerHTML = 
    mk(todayWeight,'体重kg', 'var(--peach)') +
    mk(todayCals,'热量kcal', 'var(--coral)') +
    mk(todayTrain,'训练次', 'var(--mint)') +
    mk(todayInsp,'新灵感', 'var(--lavender)');

  // === 小助理问候 ===
  const hasHealth = todayHealth.length>0 && (todayHealth.some(r=>r.weight) || todayHealth.some(r=>r.training));
  const pendingTasks = tasks.filter(t=>!t.completed);
  const highTask = tasks.find(t=>!t.completed&&t.priority==='高');
  let assistMsg='',assistHtml='';
  if(!hasHealth&&pendingTasks.length===0) assistMsg='早上好，今天还没有安排，也没有记录身体数据呢';
  else if(!hasHealth) assistMsg='你还没记录今天的身体数据，记得称个体重哦';
  else if(pendingTasks.length===0) assistMsg='今天待办清空了，享受充实的一天吧';
  else if(highTask) assistMsg='今日最重要的任务是「'+highTask.title+'」，加油';
  else assistMsg='你今天有'+pendingTasks.length+'件待办，开始行动吧';
  if(!hasHealth) assistHtml+=`<button class="btn btn-primary btn-xs" onclick="navigate('health');openModal('health')">记录身体数据</button>`;
  document.getElementById('assistant-msg').textContent=assistMsg;
  document.getElementById('assistant-actions').innerHTML=assistHtml;

  // === 今日主任务 ===
    `<div style="padding:8px 0"><div style="display:flex;align-items:center;gap:12px"><div class="task-cb" onclick="toggleTask('${mainT.id}')" style="min-width:26px;min-height:26px;border-radius:50%"></div><div style="flex:1"><div style="font-size:.9rem;font-weight:600;color:var(--text)">${mainT.title}</div><div style="display:flex;gap:6px;margin-top:4px;font-size:.72rem"><span class="badge-tag badge-${mainT.priority==='高'?'coral':'butter'}">${mainT.priority}优先级</span><span class="badge-tag badge-soft">${mainT.category}</span>${mainT.dueDate?`<span style="color:var(--text-soft)">${mainT.dueDate}</span>`:''}</div></div><button class="btn btn-primary btn-xs" onclick="event.stopPropagation();toggleTask('${mainT.id}')">完成</button></div></div>`:'<div style="text-align:center;color:var(--text-soft);padding:20px">今天没有待办任务，给自己放个假吧</div>';

  // === 打卡项目 + 待办分类 ===
  const checkin = tasks.filter(t=>!t.completed&&t.category==='打卡');
  const normal = tasks.filter(t=>!t.completed&&t.category!=='打卡');
  const cats=['工作','生活','广告','理财'],grouped={};cats.forEach(c=>{grouped[c]=normal.filter(t=>t.category===c);});
  
  let supportHTML = '';
  // 打卡项目
  if (checkin.length > 0) {
    supportHTML += `<div style="margin-bottom:14px"><div style="font-size:.75rem;font-weight:700;color:var(--peach);margin-bottom:6px;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--peach)"></span>打卡项目 ${checkin.length}</div>`;
    supportHTML += checkin.map(t=>`<div class="task-card" style="margin-bottom:6px;border-left:3px solid var(--peach)"><div class="task-cb" onclick="toggleTask('${t.id}')"></div><div class="task-body"><div class="task-title">${t.title}</div><div class="task-meta">${t.dueDate?`<span style="color:var(--text-soft)">${t.dueDate}</span>`:''}${t.notes?`<span style="color:var(--text-soft)"> ${t.notes}</span>`:''}</div></div><div class="task-actions"><button onclick="editTask('${t.id}')">编</button><button onclick="deleteTask('${t.id}')">删</button></div></div>`).join('')+'</div>';
  }
  // 待办分类
  const catsWithData = cats.filter(c=>grouped[c].length>0);
  if (catsWithData.length > 0) {
    supportHTML += catsWithData.map(c=>`<div style="margin-bottom:10px"><div style="font-size:.75rem;font-weight:700;color:var(--text-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--lavender)"></span>${c} ${grouped[c].length}</div>${grouped[c].map(t=>`<div class="task-card" style="margin-bottom:6px"><div class="task-cb" onclick="toggleTask('${t.id}')"></div><div class="task-body"><div class="task-title">${t.title}</div><div class="task-meta"><span class="badge-tag badge-${t.priority==='高'?'coral':t.priority==='中'?'butter':'mint'}">${t.priority}</span>${t.dueDate?`<span style="color:var(--text-soft)">${t.dueDate}</span>`:''}</div></div><div class="task-actions"><button onclick="editTask('${t.id}')">编</button><button onclick="deleteTask('${t.id}')">删</button></div></div>`).join('')}</div>`).join('');
  }
  document.getElementById('home-support').innerHTML=supportHTML||'<div style="text-align:center;color:var(--text-soft);padding:20px">今天没事了</div>';
  document.getElementById('home-support-count').textContent=pending.length+' 项';
}

function addTask() {
  const inp = document.getElementById('task-input'), title = inp.value.trim();
  if (!title) return;
  Store.data.tasks.unshift({ id:genId(), title, category:document.getElementById('task-cat').value, priority:'中', dueDate:'', notes:'', completed:false, createdAt:today() });
  inp.value = ''; Store.save(); renderTasks(); renderHome();
}
function toggleTask(id) { const t=Store.data.tasks.find(x=>x.id===id); if(!t) return; t.completed=!t.completed; Store.save(); renderTasks(); if(currentPage==='home') renderHome(); }
function deleteTask(id) { Store.data.tasks=Store.data.tasks.filter(x=>x.id!==id); Store.save(); renderTasks(); if(currentPage==='home') renderHome(); }

function editTask(id) {
  const t = Store.data.tasks.find(x=>x.id===id); if(!t) return;
  editId=id; currentModal='task';
  document.getElementById('modal-body').innerHTML = `<h3>编辑任务</h3>
    <div class="modal-field"><label>标题</label><input id="me-title" value="${t.title||''}"></div>
    <div class="modal-field"><label>分类</label><select id="me-cat">${['工作','生活','广告','理财','打卡'].map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="modal-field"><label>优先级</label><select id="me-pri">${['高','中','低'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>

let weightChart=null;
function renderHealth() {
  const recs = Store.data.health_records.sort((a,b)=>b.date.localeCompare(a.date));
  const now = new Date(); const d=now.getDay(); const mon = new Date(now); mon.setDate(now.getDate()-(d===0?6:d-1));
  const ws = mon.toISOString().slice(0,10);
  const wk = recs.filter(r=>r.date>=ws);
  const avgW = wk.filter(r=>r.weight).length?((wk.filter(r=>r.weight).reduce((s,r)=>s+(r.weight||0),0)/wk.filter(r=>r.weight).length)||0).toFixed(1):0;
  const totC = wk.reduce((s,r)=>s+(r.calories||0),0);
  const trD = wk.filter(r=>r.training&&r.training!=='休息').length;
  const daD = wk.filter(r=>r.dance).length;
  document.getElementById('health-stats').innerHTML = `
    <div class="stat-circle" style="color:var(--peach)"><div class="pct" style="font-size:1.3rem">${avgW||'--'}</div><div class="stat-name">平均kg</div><div class="stat-val">本周</div></div>
    <div class="stat-circle" style="color:var(--coral)"><div class="pct" style="font-size:1.3rem">${totC}</div><div class="stat-name">总热量</div><div class="stat-val">本周</div></div>
    <div class="stat-circle" style="color:var(--mint)"><div class="pct" style="font-size:1.3rem">${trD}</div><div class="stat-name">训练</div><div class="stat-val">本周次</div></div>
    <div class="stat-circle" style="color:var(--lavender)"><div class="pct" style="font-size:1.3rem">${daD}</div><div class="stat-name">跳舞</div><div class="stat-val">本周天</div></div>`;
  document.getElementById('health-list').innerHTML = recs.length===0
    ? '<div style="text-align:center;padding:40px;color:var(--text-soft)">暂无记录</div>'
    : recs.map(r=>`<div class="health-row"><span class="hr-date">${r.date}</span><span class="hr-weight">${r.weight?r.weight+'kg':''}</span><span>${r.calories?r.calories+'kcal':''}</span><span>${r.training||''}</span><span>${r.dance?'舞':''}</span><span style="font-size:.75rem;color:var(--text-soft);flex:1">${r.notes||''}</span><button class="btn-ghost btn-xs" onclick="editHealth('${r.id}')">编</button><button class="btn-danger btn-xs" onclick="deleteHealth('${r.id}')">删</button></div>`).join('');
  const ctx=document.getElementById('weight-chart');
  if (!ctx) return;
  if (weightChart) weightChart.destroy();
  const cd=[...recs].reverse();
  weightChart = new Chart(ctx, { type:'line', data:{ labels:cd.map(r=>r.date.slice(5)), datasets:[{ data:cd.map(r=>r.weight||null), borderColor:'#F4A78B', backgroundColor:'rgba(244,167,139,.15)', fill:true, tension:.4, pointRadius:3, pointBackgroundColor:'#F4A78B', borderWidth:2 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'#F5EBDC'}},x:{grid:{display:false}}} } });
}

function saveStudy() {
  const tags=(document.getElementById('me-sn-tags').value||'').split(',').map(t=>t.trim()).filter(Boolean);
  const d={id:editId||genId(),title:document.getElementById('me-sn-title').value,category:document.getElementById('me-sn-cat').value,content:document.getElementById('me-sn-content').value,tags,createdAt:today(),updatedAt:today()};
  if (editId) { const idx=Store.data.study_notes.findIndex(x=>x.id===editId); if(idx>=0){d.createdAt=Store.data.study_notes[idx].createdAt; Store.data.study_notes[idx]=d;} } else Store.data.study_notes.unshift(d);
  closeModal(); Store.save(); renderStudy();
}

// ============================================================
// AI
// ============================================================
function runAI() {
  const inp=document.getElementById('ai-input'), q=inp.value.trim();
  if (!q) return; inp.value='';
  const msg=document.getElementById('ai-msg'); msg.style.display='block';
  if (q.includes('添加')||q.includes('记录')||q.includes('新建')) {
    if (q.includes('体重')||q.includes('健身')||q.includes('健康')) { navigate('health'); openModal('health'); msg.textContent='已打开健康记录表单'; }
    else if (q.includes('新闻')||q.includes('财报')||q.includes('股票')) { navigate('finance'); openModal('finance'); msg.textContent='已打开财经新闻表单'; }
    else if (q.includes('笔记')||q.includes('学习')) { navigate('study'); openModal('study'); msg.textContent='已打开学习笔记表单'; }
    else if (q.includes('灵感')) { navigate('insp'); msg.textContent='已打开灵感库'; }
    else { document.getElementById('task-input').value=q.replace(/添加|帮我|一个|明天/g,'').trim(); document.getElementById('task-cat').value=q.includes('工作')?'工作':q.includes('生活')?'生活':q.includes('广告')?'广告':q.includes('理财')?'理财':q.includes('打卡')?'打卡':'工作'; addTask(); msg.textContent='已添加任务'; }
  } else if (q.includes('体重')||q.includes('趋势')||q.includes('健康')||q.includes('减肥')) { navigate('home'); msg.textContent='已回到首页查看健康数据'; }
  else if (q.includes('新闻')||q.includes('投资')||q.includes('钼')||q.includes('恒生')) { navigate('finance'); msg.textContent='已打开财经新闻'; }
  else if (q.includes('热点')||q.includes('运营')||q.includes('小红书')) { navigate('xhs'); msg.textContent='已打开小红书运营'; }
  else if (q.includes('笔记')||q.includes('学习')||q.includes('读书')) { navigate('study'); msg.textContent='已打开学习笔记'; }
  else if (q.includes('灵感')||q.includes('想法')) { navigate('insp'); msg.textContent='已打开灵感库'; }
  else msg.textContent='正在思考... 这类复杂分析交给 WorkBuddy 处理';
  setTimeout(()=>msg.style.display='none',3000);
}

// ============================================================
// Login & Init
// ============================================================
function showLogin() { document.getElementById('login-overlay').style.display='flex'; }
function hideLogin() { document.getElementById('login-overlay').style.display='none'; }

async function doLogin() {
  const u=document.getElementById('login-user').value.trim(), p=document.getElementById('login-pass').value, e=document.getElementById('login-err');
  if (u!=='admin'||p!=='Admin123') { e.textContent='用户名或密码错误'; return; }
  e.textContent=''; hideLogin(); localStorage.setItem('ws_logged','1');
  Store.loadLocal();
  try { await Store.initCloud(); } catch(ex) { console.error(ex); toast('连接失败'); return; }
  buildNav();
}

(async function init() {
  const loggedIn = localStorage.getItem('ws_logged')==='1';
  if (!loggedIn) { showLogin(); return; }
  try { buildNav(); } catch(e) { console.error(e); showLogin(); return; }
  hideLogin(); Store.loadLocal();
  await Store.initCloud();
  buildNav();
})();
</script>
