<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>个人工作台</title>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ====== Design System:  ====== */
:root {
  --blue: #2563EB; --blue-light: #3B82F6; --blue-deep: #1D4ED8; --blue-bg: #EFF6FF;
  --yellow: #F59E0B; --yellow-light: #FBBF24; --yellow-bg: #FFFBEB; --yellow-deep: #D97706;
  --coral: #F97316; --coral-bg: #FFF7ED;
  --slate: #1E293B; --muted: #64748B; --border: #E2E8F0; --bg: #F8FAFC;
  --card: #FFFFFF; --white: #FFFFFF;
  --radius: 14px; --radius-sm: 10px; --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --sidebar-w: 220px;
  --font: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--slate);line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:.9rem}
input,textarea,select{font-family:inherit;font-size:.9rem;color:var(--slate);outline:none}
a{color:var(--blue);text-decoration:none}
ul{list-style:none}

/* ====== Layout ====== */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#1E3A5F 0%,#1D4ED8 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;color:#fff;transition:transform .3s}
.sidebar-top{padding:20px 16px 12px}
.sidebar-top h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:6px;color:#fff}
.sidebar-top .sub{font-size:.7rem;opacity:.6;margin-top:2px}
.sidebar-nav{flex:1;padding:8px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:2px;font-size:.85rem;color:rgba(255,255,255,.7);transition:all .15s;width:100%;text-align:left;font-weight:400}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.nav-item .icon{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0}
.nav-item .badge{min-width:22px;height:20px;padding:0 6px;background:var(--yellow);color:#fff;font-size:.65rem;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:auto;line-height:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:.7rem}
.sidebar-footer .status-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sidebar-footer .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-footer .dot.on{background:#34D399}
.sidebar-footer .dot.off{background:#F87171}
.sidebar-footer .sync{font-size:.65rem;opacity:.5}

#main{flex:1;margin-left:var(--sidebar-w);padding:16px 20px;max-width:1100px;position:relative}

/* ====== Top bar (mobile) ====== */
#topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:var(--blue);color:#fff;padding:10px 14px;align-items:center;justify-content:space-between}
#topbar h1{font-size:1rem;font-weight:700}
#topbar .menu-btn{font-size:1.4rem;padding:4px}

/* ====== Bottom nav (mobile) ====== */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:99;background:#fff;border-top:1px solid var(--border);padding:4px 0 env(safe-area-inset-bottom,4px)}
#bottom-nav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.65rem;color:var(--muted);transition:all .15s}
#bottom-nav .bn-item.active{color:var(--blue);font-weight:600}
#bottom-nav .bn-item .icon{font-size:1.2rem}

/* ====== Cards & Common ====== */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-sm{padding:12px;border-radius:var(--radius-sm)}
.page-header{margin-bottom:16px}
.page-header h2{font-size:1.3rem;font-weight:700;color:var(--slate)}
.page-header .desc{font-size:.8rem;color:var(--muted);margin-top:2px}
.btn{padding:8px 16px;border-radius:var(--radius-xs);font-size:.85rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-primary:hover{background:var(--blue-light);transform:translateY(-1px)}
.btn-yellow{background:var(--yellow);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.btn-yellow:hover{background:var(--yellow-light)}
.btn-ghost{background:var(--bg);color:var(--muted)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{color:#EF4444;background:#FEF2F2}
.btn-danger:hover{background:#FEE2E2}
.btn-xs{padding:4px 10px;font-size:.75rem}
.btn-sm{padding:6px 12px;font-size:.8rem}
.badge-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow-deep)}
.badge-coral{background:var(--coral-bg);color:var(--coral)}
.badge-gray{background:#F1F5F9;color:var(--muted)}

/* ====== Filter Tabs ====== */
.filter-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-tab{padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:500;background:#fff;color:var(--muted);border:1px solid var(--border);white-space:nowrap;transition:all .15s}
.filter-tab:hover{border-color:var(--blue);color:var(--blue)}
.filter-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.filter-tab .count{font-size:.7rem;opacity:.8;margin-left:3px}

/* ====== Task Module ====== */
.add-bar{display:flex;gap:8px;margin-bottom:14px}
.add-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.add-bar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.add-bar select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;margin-bottom:6px;transition:all .15s}
.task-item:hover{border-color:var(--blue-light);box-shadow:var(--shadow)}
.task-item.done{opacity:.5}
.task-item.done .task-title{text-decoration:line-through}
.task-cb{width:20px;height:20px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .15s;color:transparent}
.task-cb.checked{background:var(--blue);border-color:var(--blue);color:#fff}
.task-body{flex:1;min-width:0}
.task-title{font-size:.9rem;font-weight:500}
.task-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;font-size:.7rem}
.task-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task-item:hover .task-actions{opacity:1}

/* ====== Finance News ====== */
.news-card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;margin-bottom:8px}
.news-card .news-title{font-size:.9rem;font-weight:600;margin-bottom:4px}
.news-card .news-summary{font-size:.8rem;color:var(--muted);margin-bottom:8px;line-height:1.5}
.news-card .news-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.news-card .news-footer{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;margin-top:8px}

/* ====== Health ====== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{padding:14px;border-radius:var(--radius-sm);text-align:center;background:#fff;border:1px solid var(--border)}
.stat-card .stat-val{font-size:1.5rem;font-weight:700;color:var(--blue)}
.stat-card .stat-label{font-size:.7rem;color:var(--muted);margin-top:2px}
.chart-wrap{background:#fff;border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-bottom:16px;height:260px}
.health-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85rem}
.health-row:last-child{border-bottom:none}
.health-row .hr-date{min-width:70px;color:var(--muted);font-size:.8rem}
.health-row .hr-weight{font-weight:600;color:var(--blue);min-width:60px}

/* ====== XHS Module ====== */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kanban-col{background:#fff;border-radius:var(--radius-sm);border:1px solid var(--border);padding:10px;min-height:120px}
.kanban-col .col-hd{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.kanban-col .col-count{background:var(--blue);color:#fff;font-size:.65rem;padding:1px 6px;border-radius:10px}
.kanban-card{padding:8px 10px;background:var(--bg);border-radius:var(--radius-xs);margin-bottom:6px;font-size:.8rem;cursor:pointer;border:1px solid transparent;transition:all .15s}
.kanban-card:hover{border-color:var(--blue);background:#fff}
.kanban-card .kc-title{font-weight:500}
.kanban-card .kc-meta{font-size:.7rem;color:var(--muted);margin-top:2px}
.kanban-add{font-size:.75rem;color:var(--blue);cursor:pointer;padding:4px;text-align:center;border-radius:var(--radius-xs);border:1px dashed var(--border);transition:all .15s}
.kanban-add:hover{background:var(--blue-bg)}

/* ====== Study Notes ====== */
.note-card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;margin-bottom:8px;cursor:pointer;transition:all .15s}
.note-card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.note-card .note-title{font-size:.9rem;font-weight:600;margin-bottom:4px}
.note-card .note-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note-card .note-preview{font-size:.8rem;color:var(--muted);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ====== Inspiration ====== */
.insp-quick{display:flex;gap:8px;margin-bottom:14px}
.insp-quick input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.insp-quick input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.insp-card{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
.insp-card .insp-status{font-size:.65rem;padding:2px 8px;border-radius:10px;flex-shrink:0;margin-top:3px}
.insp-card .insp-body{flex:1}
.insp-card .insp-title{font-size:.9rem;font-weight:500}
.insp-card .insp-meta{font-size:.7rem;color:var(--muted);margin-top:2px;display:flex;gap:6px}
.insp-card .insp-actions{display:flex;gap:4px;flex-shrink:0}

/* ====== AI Command Bar ====== */
.ai-bar{position:fixed;bottom:20px;left:calc(var(--sidebar-w) + 20px);right:20px;z-index:50;display:flex;gap:8px;align-items:center}
.ai-bar input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:30px;background:#fff;font-size:.9rem;box-shadow:var(--shadow-md);transition:all .15s}
.ai-bar input:focus{border-color:var(--blue);box-shadow:0 4px 16px rgba(37,99,235,.15)}
.ai-bar .ai-send{padding:10px 18px;border-radius:30px;background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;font-weight:600;font-size:.85rem;box-shadow:0 2px 8px rgba(37,99,235,.3);white-space:nowrap}
.ai-msg{position:fixed;bottom:80px;left:calc(var(--sidebar-w) + 20px);right:20px;z-index:49;padding:8px 16px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:.8rem;display:none;max-width:600px}

/* ====== Modal ====== */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--slate)}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.modal-field input:focus,.modal-field textarea:focus,.modal-field select:focus{border-color:var(--blue)}
.modal-field textarea{resize:vertical;min-height:80px;font-size:.85rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ====== Toast ====== */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,.95);color:#fff;padding:10px 24px;border-radius:20px;font-size:.8rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ====== Login ====== */
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#1E3A5F,#2563EB);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:var(--radius);padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:340px;max-width:90vw}
.login-card h2{font-size:1.2rem;margin-bottom:4px;text-align:center}
.login-card .sub{font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:20px}
.login-card .field{margin-bottom:14px}
.login-card .field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.login-card .field input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:1rem}
.login-card .field input:focus{border-color:var(--blue)}
.login-card .err{font-size:.7rem;color:#EF4444;margin-top:4px;min-height:18px}
.login-card .btn-full{width:100%;padding:12px;background:var(--blue);color:#fff;border-radius:var(--radius-sm);font-size:1rem;font-weight:700}
.login-card .btn-full:disabled{opacity:.5}

/* ====== Tag Input ====== */
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;min-height:38px;align-items:center}
.tag-input-wrap:focus-within{border-color:var(--blue)}
.tag-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:var(--blue-bg);color:var(--blue);border-radius:12px;font-size:.75rem;font-weight:500}
.tag-chip .tag-rm{cursor:pointer;font-size:.9rem;line-height:1;margin-left:2px}
.tag-input-wrap input{border:none;outline:none;flex:1;min-width:60px;padding:2px;font-size:.85rem;background:transparent}

/* ====== Responsive ====== */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding:48px 10px 80px}
  #topbar{display:flex}
  #bottom-nav{display:flex}
  .ai-bar{left:10px;right:10px;bottom:75px}
  .ai-msg{left:10px;right:10px;bottom:125px}
  .kanban{grid-template-columns:repeat(2,1fr)}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .add-bar{flex-direction:column}
}
</style>
</head>
<body>
<div id="app">

<!-- Login -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2> 个人工作台</h2>
    <div class="sub">个人工作台</div>
    <div class="field"><label>用户名</label><input id="login-user" placeholder="admin"></div>
    <div class="field"><label>密码</label><input id="login-pass" type="password" placeholder="Admin123"></div>
    <div class="err" id="login-err"></div>
    <button class="btn-full" onclick="doLogin()">登录</button>
  </div>
</div>

<!-- Top bar (mobile) -->
<div id="topbar"><button class="menu-btn" onclick="toggleSidebar()"></button><h1> 工作台</h1><div style="width:28px"></div></div>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="sidebar-top"><h1>个人工作台</h1></div>
  <div class="sidebar-nav" id="sidebar-nav"></div>
  <div class="sidebar-footer">
    <div class="status-row"><span class="dot off" id="cloud-dot"></span><span style="font-size:.7rem" id="cloud-text">连接中...</span></div>
    <div class="sync" id="last-sync"></div>
  </div>
</nav>

<!-- Main -->
<main id="main">
<!-- Page: Tasks -->
<div id="pg-tasks" class="page" style="display:none">
  <div class="page-header"><h2> 待办任务</h2><div class="desc">按分类管理你的待办事项</div></div>
  <div class="add-bar"><input id="task-input" placeholder="快速添加任务..." onkeypress="if(event.key==='Enter')addTask()"><select id="task-cat"><option value="工作">工作</option><option value="生活">生活</option><option value="广告">广告</option><option value="理财">理财</option></select><button class="btn btn-primary" onclick="addTask()">添加</button></div>
  <div class="filter-tabs" id="task-tabs"></div>
  <div id="task-list"></div>
</div>

<!-- Page: Finance News -->
<div id="pg-finance" class="page" style="display:none">
  <div class="page-header"><h2> 财经新闻</h2><div class="desc">关注你的投资领域</div></div>
  <button class="btn btn-primary" style="margin-bottom:12px" onclick="openModal('finance')">+ 添加新闻</button>
  <div class="filter-tabs" id="finance-tabs"></div>
  <div id="finance-list"></div>
</div>

<!-- Page: Health -->
<div id="pg-health" class="page" style="display:none">
  <div class="page-header"><h2> 健康减重</h2><div class="desc">记录身体变化，看见进步</div></div>
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn btn-primary btn-sm" onclick="openModal('health')">+ 添加记录</button>
    <button class="btn btn-ghost btn-sm" onclick="renderHealth()">刷新统计</button>
  </div>
  <div class="stats-grid" id="health-stats"></div>
  <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
  <div id="health-list" class="card" style="padding:0"></div>
</div>

<!-- Page: XHS -->
<div id="pg-xhs" class="page" style="display:none">
  <div class="page-header"><h2> 小红书运营</h2><div class="desc">内容管理 + 热点追踪</div></div>
  <div class="filter-tabs" style="margin-bottom:12px">
    <button class="filter-tab active" onclick="xhsTab='content';renderXHS()">内容管理</button>
    <button class="filter-tab" onclick="xhsTab='hot';renderXHS()">热点追踪</button>
  </div>
  <div id="xhs-content"></div>
</div>

<!-- Page: Study -->
<div id="pg-study" class="page" style="display:none">
  <div class="page-header"><h2> 学习笔记</h2><div class="desc">读书 · 课程 · 感悟 · 技能</div></div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-primary btn-sm" onclick="openModal('study')">+ 新建笔记</button>
    <button class="btn btn-yellow btn-sm" onclick="syncToObsidian()"> 同步 Obsidian</button>
  </div>
  <div class="filter-tabs" id="study-tabs"></div>
  <div id="study-list"></div>
</div>

<!-- Page: Inspiration -->
<div id="pg-insp" class="page" style="display:none">
  <div class="page-header"><h2> 灵感库</h2><div class="desc">一闪而过的想法，都值得留住</div></div>
  <div class="insp-quick"><input id="insp-input" placeholder="快速记录想法..." onkeypress="if(event.key==='Enter')addInsp()"><button class="btn btn-yellow btn-sm" onclick="addInsp()">保存</button></div>
  <div class="filter-tabs" id="insp-tabs"></div>
  <div id="insp-list"></div>
</div>

</main>

<!-- AI Command Bar -->
<div class="ai-bar" id="ai-bar"><input id="ai-input" placeholder=" 对我说：添加任务、查体重、找新闻..." onkeypress="if(event.key==='Enter')runAI()"><button class="ai-send" onclick="runAI()">发送</button></div>
<div class="ai-msg" id="ai-msg"></div>

<!-- Modal -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Bottom nav (mobile) -->
<div id="bottom-nav"></div>

</div>

<script>
// ============================================================
// Data Store
// ============================================================
const Store = {
  data: {
    tasks: [],
    study_notes: [],
    finance_news: [],
    health_records: [],
    xhs_content: [],
    hot_topics: [],
    inspirations: []
  },
  envId: 'yayaliu-d4g1i1dc2fdb04417',
  app: null, auth: null, db: null, ready: false, cloudOk: false,
  _hadSyncBefore: false, _syncTimer: null,
  async initCloud() {
    try {
      if (typeof cloudbase === 'undefined') throw new Error('SDK未加载');
      const app = cloudbase.init({ env: this.envId });
      let ls;
      try { ls = await app.auth.getLoginState(); } catch(e){}
      if (!ls) {
        const { error } = await app.auth.signInWithPassword({ username: 'admin', password: 'Admin123' });
        if (error) throw new Error(error.message || '登录失败');
      }
      this.auth = app.auth; this.app = app; this.db = app.database(); this.ready = true;
      this.updateStatus('connecting');
      await this.loadFromCloud();
      this.cloudOk = true; this.updateStatus('cloud');
      return true;
    } catch(e) {
      this.ready = false; this.cloudOk = false; this.updateStatus('offline');
      toast('连接失败: ' + (e.message || '网络错误'));
      return false;
    }
  },
  async loadFromCloud() {
    if (!this.ready || !this.db) return;
    const dedup = (arr, key='id') => { const s=new Set(); return arr.filter(x=>{ const v=x[key]||''; if(s.has(v)) return false; s.add(v); return true; }); };
    const strip = (d) => { const {_id,_openid,createdAt,updatedAt,...r}=d; return r; };
    const sg = async (col, key) => { try { const r=await this.db.collection(col).limit(1000).get(); return (r.data||[]).map(strip); } catch(e){ return []; } };
    const ct = dedup(await sg('tasks'));
    const sn = dedup(await sg('study_notes'));
    const fn = await sg('finance_news');
    const hr = dedup(await sg('health_records'));
    const xc = dedup(await sg('xiaohongshu'));
    const ht = dedup(await sg('hot_topics'));
    const ins = dedup(await sg('inspirations'));
    let hasCloud = false;
    if (ct.length) { this.data.tasks = ct; hasCloud = true; }
    if (sn.length) { this.data.study_notes = sn; hasCloud = true; }
    if (fn.length) { this.data.finance_news = fn; hasCloud = true; }
    if (hr.length) { this.data.health_records = hr; hasCloud = true; }
    if (xc.length) { this.data.xhs_content = xc; hasCloud = true; }
    if (ht.length) { this.data.hot_topics = ht; hasCloud = true; }
    if (ins.length) { this.data.inspirations = ins; hasCloud = true; }
    if (hasCloud) { this.saveLocal(); this.updateSyncTime(); }
    else if (this._hadSyncBefore) { this.data.tasks=[]; this.data.finance_news=[]; this.data.health_records=[]; this.data.xhs_content=[]; this.data.hot_topics=[]; this.data.inspirations=[]; this.saveLocal(); }
    else if (this.data.tasks.length||this.data.study_notes.length) { await this.saveToCloud(); }
  },
  async saveToCloud() {
    if (!this.ready || !this.db) return;
    const repl = async (col, items) => {
      const ex = await col.limit(1000).get();
      for (const d of ex.data||[]) try { await col.doc(d._id).remove(); } catch(e){}
      for (const i of items) await col.add({...i});
    };
    try { const o=await repl(this.db.collection('tasks'),this.data.tasks); } catch(e){}
    try { await repl(this.db.collection('study_notes'),this.data.study_notes); } catch(e){}
    try { await repl(this.db.collection('finance_news'),this.data.finance_news); } catch(e){}
    try { await repl(this.db.collection('health_records'),this.data.health_records); } catch(e){}
    try { await repl(this.db.collection('xiaohongshu'),this.data.xhs_content); } catch(e){}
    try { await repl(this.db.collection('hot_topics'),this.data.hot_topics); } catch(e){}
    try { await repl(this.db.collection('inspirations'),this.data.inspirations); } catch(e){}
    this.updateSyncTime(); this.updateStatus('cloud');
  },
  loadLocal() {
    try {
      const r = localStorage.getItem('ws_data');
      if (r) { const p=JSON.parse(r); this.data = Object.assign(this.data, p); }
      else { this.data.study_notes = [{id:'s1',title:'系统分析师备考',category:'课程',content:'## 知识点\n- 计算机系统基础\n- 软件工程',tags:['考试'],createdAt:'2026-07-29',updatedAt:'2026-07-29'}]; }
      this._hadSyncBefore = localStorage.getItem('ws_hadsync')==='1';
    } catch(e) {}
  },
  saveLocal() { localStorage.setItem('ws_data', JSON.stringify(this.data)); },
  async save() { this.saveLocal(); clearTimeout(this._syncTimer); this._syncTimer = setTimeout(()=>this.saveToCloud(),500); },
  updateStatus(s) {
    const d=document.getElementById('cloud-dot'),t=document.getElementById('cloud-text');
    if (s==='cloud') { d.classList.add('on'); d.classList.remove('off'); t.textContent='已连接'; }
    else if (s==='connecting') { d.classList.add('on'); d.classList.remove('off'); t.textContent='连接中...'; }
    else { d.classList.add('off'); d.classList.remove('on'); t.textContent='离线'; }
  },
  updateSyncTime() {
    const n=new Date(),el=document.getElementById('last-sync');
    if(el) el.textContent='同步 '+n.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    this._hadSyncBefore=true; localStorage.setItem('ws_hadsync','1');
  }
};

const genId = () => 'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);

function toast(msg) {
  const e = document.getElementById('toast'); e.textContent = msg; e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 2000);
}

const pages = [
  {id:'tasks', icon:'', label:'待办任务', cat:'tasks'},
  {id:'finance', icon:'', label:'财经新闻', cat:'finance_news'},
  {id:'health', icon:'', label:'健康减重', cat:'health_records'},
  {id:'xhs', icon:'', label:'小红书运营', cat:'xhs_content'},
  {id:'study', icon:'', label:'学习笔记', cat:'study_notes'},
  {id:'insp', icon:'', label:'灵感库', cat:'inspirations'},
];

function navigate(id) {
  currentPage = id;
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById('pg-'+id).style.display='block';
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('.nav-item[data-page="'+id+'"]')?.classList.add('active');
  document.querySelectorAll('.bn-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('.bn-item[data-page="'+id+'"]')?.classList.add('active');
  if (id==='tasks') renderTasks();
  if (id==='finance') renderFinance();
  if (id==='health') renderHealth();
  if (id==='xhs') renderXHS();
  if (id==='study') renderStudy();
  if (id==='insp') renderInsp();
  if (window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function buildNav() {
  let h=''; let b='';
  pages.forEach(p=>{
    h+=`<button class="nav-item" data-page="${p.id}" onclick="navigate('${p.id}')"><span class="icon">${p.icon}</span>${p.label}</button>`;
    if (p.id!=='insp' && p.id!=='study') b+=`<button class="bn-item" data-page="${p.id}" onclick="navigate('${p.id}')"><span class="icon">${p.icon}</span>${p.label}</button>`;
  });
  b+=`<button class="bn-item" data-page="more" onclick="toggleSidebar()"><span class="icon"></span>更多</button>`;
  document.getElementById('sidebar-nav').innerHTML = h;
  document.getElementById('bottom-nav').innerHTML = b;
  navigate('tasks');
}

function addTask() {
  const inp = document.getElementById('task-input'), title = inp.value.trim();
  if (!title) return;
  Store.data.tasks.unshift({ id:genId(), title, category:document.getElementById('task-cat').value, priority:'中', dueDate:'', notes:'', completed:false, createdAt:today() });
  inp.value = ''; Store.save(); renderTasks();
}

function toggleTask(id) {
  const t = Store.data.tasks.find(x=>x.id===id); if(!t) return;
  t.completed = !t.completed; Store.save(); renderTasks();
}

function deleteTask(id) {
  Store.data.tasks = Store.data.tasks.filter(x=>x.id!==id);
  Store.save(); renderTasks();
}

function editTask(id) {
  const t = Store.data.tasks.find(x=>x.id===id); if(!t) return;
  editId = id; currentModal = 'task';
  document.getElementById('modal-body').innerHTML = `
    <h3>编辑任务</h3>
    <div class="modal-field"><label>标题</label><input id="me-title" value="${t.title||''}"></div>
    <div class="modal-field"><label>分类</label><select id="me-cat">${['工作','生活','广告','理财'].map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="modal-field"><label>优先级</label><select id="me-pri">${['高','中','低'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="modal-field"><label>截止日期</label><input id="me-due" type="date" value="${t.dueDate||''}"></div>
    <div class="modal-field"><label>备注</label><textarea id="me-notes">${t.notes||''}</textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTaskEdit()">保存</button></div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function saveTaskEdit() {
  const t = Store.data.tasks.find(x=>x.id===editId); if(!t) return;
  t.title = document.getElementById('me-title').value;
  t.category = document.getElementById('me-cat').value;
  t.priority = document.getElementById('me-pri').value;
  t.dueDate = document.getElementById('me-due').value;
  t.notes = document.getElementById('me-notes').value;
  closeModal(); Store.save(); renderTasks();
}

function renderTasks() {
  const cats = ['全部','工作','生活','广告','理财'];
  const counts = {}; cats.forEach(c=>{ counts[c] = c==='全部'?Store.data.tasks.length:Store.data.tasks.filter(x=>x.category===c).length; });
  document.getElementById('task-tabs').innerHTML = cats.map(c=>`<button class="filter-tab ${taskFilter===c?'active':''}" onclick="taskFilter='${c}';renderTasks()">${c}<span class="count">${counts[c]}</span></button>`).join('');
  const filtered = taskFilter==='全部'?Store.data.tasks:Store.data.tasks.filter(x=>x.category===taskFilter);
  document.getElementById('task-list').innerHTML = filtered.length===0
    ? '<div style="text-align:center;padding:40px;color:var(--muted)"> 暂无任务，添加一个开始吧</div>'
    : filtered.map(t=>`<div class="task-item ${t.completed?'done':''}">
      <div class="task-cb ${t.completed?'checked':''}" onclick="toggleTask('${t.id}')">${t.completed?'':''}</div>
      <div class="task-body"><div class="task-title">${t.title}</div>
        <div class="task-meta"><span class="badge-tag badge-${t.priority==='高'?'coral':t.priority==='中'?'yellow':'blue'}">${t.priority}</span><span class="badge-tag badge-gray">${t.category}</span>${t.dueDate?`<span style="color:var(--muted)">${t.dueDate}</span>`:''}</div>
        ${t.notes?`<div style="font-size:.75rem;color:var(--muted);margin-top:3px">${t.notes}</div>`:''}</div>
      <div class="task-actions"><button class="btn-ghost btn-xs" onclick="editTask('${t.id}')">️</button><button class="btn-danger btn-xs" onclick="deleteTask('${t.id}')"></button></div></div>`).join('');
  updateBadge('tasks', Store.data.tasks.filter(x=>!x.completed).length);
}

// Health Module
// ============================================================
let weightChart = null;

function renderHealth() {
  const recs = Store.data.health_records.sort((a,b)=>b.date.localeCompare(a.date));
  const now = new Date(); const d = now.getDay(); const mon = new Date(now); mon.setDate(now.getDate()-(d===0?6:d-1));
  const weekStart = mon.toISOString().slice(0,10);
  const week = recs.filter(r=>r.date>=weekStart);
  const avgW = week.length?((week.reduce((s,r)=>s+(r.weight||0),0)/week.filter(r=>r.weight).length)||0).toFixed(1):0;
  const totC = week.reduce((s,r)=>s+(r.calories||0),0);
  const trD = week.filter(r=>r.training&&r.training!=='休息').length;
  const daD = week.filter(r=>r.dance).length;
  document.getElementById('health-stats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${avgW||'--'}kg</div><div class="stat-label">平均体重</div></div>
    <div class="stat-card"><div class="stat-val">${totC}</div><div class="stat-label">总消耗(kcal)</div></div>
    <div class="stat-card"><div class="stat-val">${trD}次</div><div class="stat-label">训练</div></div>
    <div class="stat-card"><div class="stat-val">${daD}天</div><div class="stat-label">跳舞</div></div>`;
  document.getElementById('health-list').innerHTML = recs.length===0
    ? '<div style="text-align:center;padding:40px;color:var(--muted)"> 暂无记录</div>'
    : recs.map(r=>`<div class="health-row"><span class="hr-date">${r.date}</span><span class="hr-weight">${r.weight?r.weight+'kg':''}</span><span>${r.calories?r.calories+'kcal':''}</span><span>${r.training||''}</span><span>${r.dance?'':''}</span><span style="font-size:.75rem;color:var(--muted);flex:1">${r.notes||''}</span><button class="btn-ghost btn-xs" onclick="editHealth('${r.id}')">️</button><button class="btn-danger btn-xs" onclick="deleteHealth('${r.id}')"></button></div>`).join('');

  // Chart.js
  const ctx = document.getElementById('weight-chart');
  if (!ctx) return;
  if (weightChart) weightChart.destroy();
  const chartData = [...recs].reverse();
  const labels = chartData.map(r=>r.date.slice(5));
  const weights = chartData.map(r=>r.weight||null);
  weightChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label:'体重(kg)', data:weights, borderColor:'#2563EB', backgroundColor:'rgba(37,99,235,.08)', fill:true, tension:.4, pointRadius:3, pointBackgroundColor:'#2563EB', borderWidth:2 }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:false, grid:{color:'#f1f5f9'} }, x:{ grid:{display:false} } } }
  });
}

function deleteHealth(id) { Store.data.health_records = Store.data.health_records.filter(x=>x.id!==id); Store.save(); renderHealth(); }

function renderXHS() {
  const tabs = document.querySelectorAll('#pg-xhs .filter-tab');
  tabs.forEach(t=>t.classList.remove('active'));
  tabs[xhsTab==='content'?0:1].classList.add('active');

  if (xhsTab === 'content') {
    const stages = ['选题','拍摄','剪辑','已发布'];
    document.getElementById('xhs-content').innerHTML = `
      <button class="btn btn-primary btn-sm" style="margin-bottom:10px" onclick="openModal('xhs')">+ 添加内容</button>
      <div class="kanban">${stages.map(st=>{
        const items = Store.data.xhs_content.filter(x=>x.stage===st);
        return `<div class="kanban-col"><div class="col-hd">${st}<span class="col-count">${items.length}</span></div>
        ${items.map(x=>`<div class="kanban-card" onclick="editXHS('${x.id}')"><div class="kc-title">${x.title}</div>${x.product?`<div class="kc-meta">产品: ${x.product}</div>`:''}</div>`).join('')}
        <div class="kanban-add" onclick="openModal('xhs')">+ 添加</div></div>`;
      }).join('')}</div>`;
  } else {
    document.getElementById('xhs-content').innerHTML = `
      <button class="btn btn-yellow btn-sm" style="margin-bottom:10px" onclick="openModal('hot')">+ 添加热点</button>
      <div class="filter-tabs">${['全部','小红书','抖音','微博','B站'].map(p=>`<button class="filter-tab ${financeFilter===p?'active':''}" onclick="financeFilter='${p}';renderXHS()">${p}</button>`).join('')}</div>
      <div>${Store.data.hot_topics.filter(x=>financeFilter==='全部'||x.platform===financeFilter).map(h=>`<div class="card card-sm" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font-weight:600;font-size:.9rem">${h.title}</div><span class="badge-tag ${h.heat==='高'?'badge-coral':h.heat==='中'?'badge-yellow':'badge-gray'}">${h.heat}</span></div>
        ${h.description?`<div style="font-size:.8rem;color:var(--muted);margin:4px 0">${h.description}</div>`:''}
        <div style="display:flex;gap:6px;align-items:center;margin-top:4px;font-size:.75rem"><span>${h.platform}</span><span>${h.trend==='↑上升'?'':h.trend==='↓下降'?'':'️'} ${h.trend}</span>${h.link?`<a href="${h.link}" target="_blank"></a>`:''}</div>
      </div>`).join('')||'<div style="text-align:center;padding:40px;color:var(--muted)"> 暂无热点</div>'}</div>`;
  }
}

  closeModal(); Store.save(); renderXHS();
}

function renderStudy() {

    : filtered.map(n=>`<div class="note-card" onclick="editStudy('${n.id}')">
      <div class="note-title">${n.title}</div>
      <div class="note-meta"><span class="badge-tag badge-blue">${n.category||''}</span>${(n.tags||[]).map(t=>`<span class="badge-tag badge-yellow">${t}</span>`).join('')}<span style="font-size:.7rem;color:var(--muted);margin-left:auto">${n.updatedAt||n.createdAt||''}</span></div>
      ${n.content?`<div class="note-preview">${n.content.replace(/[#*`]/g,'').slice(0,100)}</div>`:''}</div>`).join('');
}

function deleteStudy(id) { Store.data.study_notes = Store.data.study_notes.filter(x=>x.id!==id); Store.save(); renderStudy(); }

// ============================================================
// Inspiration Module
// ============================================================
function addInsp() {
  const inp = document.getElementById('insp-input'), title = inp.value.trim();
  if (!title) return;
  Store.data.inspirations.unshift({ id:genId(), title, category:'通用', status:'未整理', tags:[], createdAt:today() });
  inp.value = ''; Store.save(); renderInsp();
}
function updateInspStatus(id) {
  const i = Store.data.inspirations.find(x=>x.id===id); if(!i) return;
  i.status = i.status==='未整理'?'已记录':'已执行'; Store.save(); renderInsp();
}
function deleteInsp(id) { Store.data.inspirations = Store.data.inspirations.filter(x=>x.id!==id); Store.save(); renderInsp(); }

function renderInsp() {
  const cats = ['全部','未整理','已记录','已执行'];
  document.getElementById('insp-tabs').innerHTML = cats.map(c=>`<button class="filter-tab ${inspFilter===c?'active':''}" onclick="inspFilter='${c}';renderInsp()">${c}<span class="count">${c==='全部'?Store.data.inspirations.length:Store.data.inspirations.filter(x=>x.status===c).length}</span></button>`).join('');
  const filtered = inspFilter==='全部'?Store.data.inspirations:Store.data.inspirations.filter(x=>x.status===inspFilter);
  document.getElementById('insp-list').innerHTML = filtered.length===0
    ? '<div style="text-align:center;padding:40px;color:var(--muted)"> 暂无灵感</div>'
    : filtered.map(i=>`<div class="insp-card">
      <span class="insp-status badge-tag ${i.status==='未整理'?'badge-coral':i.status==='已记录'?'badge-yellow':'badge-blue'}">${i.status}</span>
      <div class="insp-body"><div class="insp-title">${i.title}</div><div class="insp-meta"><span>${i.category}</span>${(i.tags||[]).map(t=>`<span>#${t}</span>`).join('')}<span>${i.createdAt}</span></div></div>
      <div class="insp-actions">${i.status!=='已执行'?`<button class="btn btn-yellow btn-xs" onclick="updateInspStatus('${i.id}')">→${i.status==='未整理'?'已记录':'已执行'}</button>`:''}<button class="btn-danger btn-xs" onclick="deleteInsp('${i.id}')"></button></div></div>`).join('');
}

// ============================================================
// Modal System
// ============================================================
function openModal(type, data) {
  editId = (data||{}).id||null; currentModal = type;
  if (type === 'task') { editTask(data?.id); return; }
  if (type === 'finance') {
    document.getElementById('modal-body').innerHTML = `<h3>${data?'编辑新闻':'添加新闻'}</h3>
      <div class="modal-field"><label>标题</label><input id="me-fn-title" value="${data?.title||''}"></div>
      <div class="modal-field"><label>摘要</label><textarea id="me-fn-sum" style="min-height:60px">${data?.summary||''}</textarea></div>
      <div class="modal-field"><label>链接</label><input id="me-fn-url" value="${data?.url||''}"></div>
      <div class="modal-field"><label>标签</label><div style="display:flex;flex-wrap:wrap;gap:6px">${financeTags.map(t=>`<label style="font-size:.8rem"><input type="checkbox" value="${t}" ${(data?.tags||[]).includes(t)?'checked':''} onchange=""> ${t}</label>`).join('')}</div></div>
      <div class="modal-field"><label>备注</label><input id="me-fn-remark" value="${data?.remark||''}"></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveFinance()">保存</button></div>`;
    document.getElementById('modal-overlay').classList.add('show');
  }
  if (type === 'health') {
    document.getElementById('modal-body').innerHTML = `<h3>${data?'编辑记录':'添加记录'}</h3>
      <div class="modal-field"><label>日期</label><input id="me-hr-date" type="date" value="${data?.date||today()}"></div>
      <div class="modal-field"><label>体重(kg)</label><input id="me-hr-weight" type="number" step="0.1" value="${data?.weight||''}"></div>
      <div class="modal-field"><label>热量(kcal)</label><input id="me-hr-cal" type="number" value="${data?.calories||''}"></div>
      <div class="modal-field"><label>训练</label><select id="me-hr-train"><option value="">--</option>${['力量','有氧','瑜伽','跳舞','休息'].map(t=>`<option ${data?.training===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="modal-field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="me-hr-dance" ${data?.dance?'checked':''}> 跳舞</label></div>
      <div class="modal-field"><label>备注</label><input id="me-hr-notes" value="${data?.notes||''}"></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveHealth()">保存</button></div>`;
    document.getElementById('modal-overlay').classList.add('show');
  }
  if (type === 'study') {
    document.getElementById('modal-body').innerHTML = `<h3>${data?'编辑笔记':'新建笔记'}</h3>
      <div class="modal-field"><label>标题</label><input id="me-sn-title" value="${data?.title||''}"></div>
      <div class="modal-field"><label>分类</label><select id="me-sn-cat">${['读书','课程','感悟','技能'].map(c=>`<option ${data?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="modal-field"><label>标签（逗号分隔）</label><input id="me-sn-tags" value="${(data?.tags||[]).join(',')}"></div>
      <div class="modal-field"><label>正文（Markdown）</label><textarea id="me-sn-content" style="min-height:150px">${data?.content||''}</textarea></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveStudy()">保存</button><button class="btn btn-danger btn-sm" onclick="deleteStudy('${data?.id||''}');closeModal()">删除</button></div>`;
    document.getElementById('modal-overlay').classList.add('show');
  }
  if (type === 'xhs') { showXHSModal(data); }
  if (type === 'hot') {
    document.getElementById('modal-body').innerHTML = `<h3>${data?'编辑热点':'添加热点'}</h3>
      <div class="modal-field"><label>标题</label><input id="me-hot-title" value="${data?.title||''}"></div>
      <div class="modal-field"><label>平台</label><select id="me-hot-plat">${['小红书','抖音','微博','B站'].map(p=>`<option ${data?.platform===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="modal-field"><label>描述</label><textarea id="me-hot-desc" style="min-height:60px">${data?.description||''}</textarea></div>
      <div class="modal-field"><label>热度</label><select id="me-hot-heat">${['高','中','低'].map(h=>`<option ${data?.heat===h?'selected':''}>${h}</option>`).join('')}</select></div>
      <div class="modal-field"><label>趋势</label><select id="me-hot-trend">${['↑上升','→平稳','↓下降'].map(t=>`<option ${data?.trend===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="modal-field"><label>链接</label><input id="me-hot-link" value="${data?.link||''}"></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveHot()">保存</button></div>`;
    document.getElementById('modal-overlay').classList.add('show');
  }
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); currentModal=null; editId=null; }

// ============================================================
// Save Handlers
// ============================================================
function saveFinance() {
  const tags = []; document.querySelectorAll('#pg-finance input[type=checkbox]:checked, #modal-body input[type=checkbox]:checked').forEach(cb=>tags.push(cb.value));
  const data = { id: editId||genId(), title: document.getElementById('me-fn-title').value, summary: document.getElementById('me-fn-sum').value, url: document.getElementById('me-fn-url').value, tags, remark: document.getElementById('me-fn-remark').value, createdAt: today() };
  if (editId) { const idx=Store.data.finance_news.findIndex(x=>x.id===editId); if(idx>=0) Store.data.finance_news[idx]=data; } else Store.data.finance_news.unshift(data);
  closeModal(); Store.save(); renderFinance();
}
function saveHealth() {
  const data = { id: editId||genId(), date: document.getElementById('me-hr-date').value, weight: parseFloat(document.getElementById('me-hr-weight').value)||0, calories: parseInt(document.getElementById('me-hr-cal').value)||0, training: document.getElementById('me-hr-train').value, dance: document.getElementById('me-hr-dance').checked, notes: document.getElementById('me-hr-notes').value, createdAt: today() };
  if (editId) { const idx=Store.data.health_records.findIndex(x=>x.id===editId); if(idx>=0) Store.data.health_records[idx]=data; } else Store.data.health_records.unshift(data);
  closeModal(); Store.save(); renderHealth();
}
function saveStudy() {
  const tags = (document.getElementById('me-sn-tags').value||'').split(',').map(t=>t.trim()).filter(Boolean);
  const data = { id: editId||genId(), title: document.getElementById('me-sn-title').value, category: document.getElementById('me-sn-cat').value, content: document.getElementById('me-sn-content').value, tags, createdAt: today(), updatedAt: today() };
  if (editId) { const idx=Store.data.study_notes.findIndex(x=>x.id===editId); if(idx>=0){ data.createdAt=Store.data.study_notes[idx].createdAt; Store.data.study_notes[idx]=data; } } else Store.data.study_notes.unshift(data);
  closeModal(); Store.save(); renderStudy();
}

// ============================================================
// AI Command Bar
// ============================================================
function runAI() {
  const inp = document.getElementById('ai-input'), q = inp.value.trim();
  if (!q) return; inp.value = '';
  const msg = document.getElementById('ai-msg'); msg.style.display = 'block';

  if (q.includes('添加')||q.includes('记录')||q.includes('新建')) {
    if (q.includes('体重')||q.includes('健身')||q.includes('运动')||q.includes('健康')) { openModal('health'); msg.textContent = ' 已打开健康记录表单'; }
    else if (q.includes('新闻')||q.includes('财报')||q.includes('股票')) { openModal('finance'); msg.textContent = ' 已打开财经新闻表单'; }
    else if (q.includes('笔记')||q.includes('学习')) { openModal('study'); msg.textContent = ' 已打开学习笔记表单'; }
    else { document.getElementById('task-input').value = q.replace(/添加|帮我|一个|明天/g,'').trim(); document.getElementById('task-cat').value = q.includes('工作')?'工作':q.includes('生活')?'生活':q.includes('广告')?'广告':q.includes('理财')?'理财':'工作'; addTask(); msg.textContent = ' 已添加任务'; }
  } else if (q.includes('体重')||q.includes('趋势')||q.includes('健康')||q.includes('减肥')) { navigate('health'); msg.textContent = ' 已打开健康减重'; }
  else if (q.includes('新闻')||q.includes('投资')||q.includes('钼')||q.includes('恒生')||q.includes('芯片')) { navigate('finance'); msg.textContent = ' 已打开财经新闻'; }
  else if (q.includes('热点')||q.includes('运营')||q.includes('小红书')) { navigate('xhs'); msg.textContent = ' 已打开小红书运营'; }
  else if (q.includes('笔记')||q.includes('学习')||q.includes('读书')) { navigate('study'); msg.textContent = ' 已打开学习笔记'; }
  else if (q.includes('灵感')||q.includes('想法')) { navigate('insp'); msg.textContent = ' 已打开灵感库'; }
  else { msg.textContent = ' 复杂问题已标记，下次 WorkBuddy 对话时帮你分析～'; }
  setTimeout(() => { msg.style.display = 'none'; }, 3000);
}

// ============================================================
// Login
// ============================================================
function showLogin() { document.getElementById('login-overlay').style.display = 'flex'; }
function hideLogin() { document.getElementById('login-overlay').style.display = 'none'; }

async function doLogin() {
  const u = document.getElementById('login-user').value.trim(), p = document.getElementById('login-pass').value, e = document.getElementById('login-err'), b = document.querySelector('.btn-full');
  if (u!=='admin'||p!=='Admin123') { e.textContent='用户名或密码错误'; return; }
  e.textContent=''; b.disabled=true; b.textContent='登录中...'; hideLogin();
  Store.loadLocal();
  await Store.initCloud();
  toast(Store.cloudOk?'已连接云端':'离线模式');
  renderAll();
  b.disabled=false; b.textContent='登录';
}

// ============================================================
// Obsidian Sync
// ============================================================
function syncToObsidian() { toast('请运行 sync_to_obsidian.py 同步到 Obsidian'); }

function updateBadge(page, n) {
  const item = document.querySelector(`.nav-item[data-page="${page}"] .badge`);
  if (item) item.textContent = n||'';
}

function renderAll() {
  navigate(currentPage);
}

// ============================================================
// Init
// ============================================================
(async function init() {
  buildNav();
  const loggedIn = localStorage.getItem('ws_logged') === '1';
  if (!loggedIn) { showLogin(); return; }
  hideLogin();
  Store.loadLocal();
  await Store.initCloud();
  renderAll();
  localStorage.setItem('ws_logged', '1');
})();
</script>
</body>
