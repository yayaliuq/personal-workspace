<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F4A78B">
<title>鸭鸭的加油站</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js"></script>
<style>
:root{--bg:#FBF6EE;--card:#fff;--text:#5C4D3A;--muted:#97876E;--border:#F0E5D2;--peach:#F4A78B;--peach-bg:#FCE8DC;--mint:#88C9A1;--mint-bg:#DDF1E5;--lavender:#B8A0D9;--lavender-bg:#EBE3F4;--sky:#88B8DD;--sky-bg:#D9E6F2;--radius:16px;--radius-sm:12px;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:.9rem}
input,textarea,select{font-family:inherit;font-size:.9rem;color:var(--text);outline:none;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--card)}
input:focus,textarea:focus,select:focus{border-color:var(--peach)}

#app{display:flex;min-height:100vh}
#sidebar{width:200px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;padding:16px 12px}
.side-logo{padding:4px 8px 16px;font-size:1rem;font-weight:700;color:var(--peach)}
.sub-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.sub-sec-title{font-size:.65rem;color:var(--muted);padding:10px 8px 4px;text-transform:uppercase;letter-spacing:.5px}
.sub-item{padding:9px 12px;border-radius:8px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px;transition:all .15s}
.sub-item:hover{background:var(--peach-bg);color:var(--text)}
.sub-item.active{background:var(--peach);color:#fff;font-weight:600}
.sub-icon{width:18px;text-align:center;font-size:.75rem;flex-shrink:0}
.side-toggle{display:none}

#main{flex:1;margin-left:200px;padding:20px 28px 40px;max-width:1080px}
#topbar{padding:0 0 16px;display:flex;align-items:center;justify-content:space-between}
#topbar h1{font-size:1.3rem;font-weight:700}
.breadcrumb{font-size:.8rem;color:var(--muted)}
.menu-toggle{display:none}

.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.card-title{font-size:.88rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-title-left{display:flex;align-items:center;gap:6px}

.btn{padding:9px 18px;border-radius:22px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn-primary{background:var(--peach);color:#fff}
.btn-outline{border:1.5px solid var(--border);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:.75rem}.btn-xs{padding:4px 10px;font-size:.7rem}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600}
.badge-peach{background:var(--peach-bg);color:#A8604A}.badge-mint{background:var(--mint-bg);color:#3E8E66}
.badge-lavender{background:var(--lavender-bg);color:#6B4F8C}.badge-soft{background:var(--bg);color:var(--muted)}

.task-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:.88rem}
.task-row:last-child{border-bottom:none}
.task-cb{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;transition:all .15s}
.task-cb.checked{background:var(--mint);border-color:var(--mint);color:#fff}
.task-title{flex:1;font-weight:500}.task-done{opacity:.5;text-decoration:line-through}
.add-bar{display:flex;gap:8px;margin-bottom:12px}.add-bar input{flex:1}

/* Checkin */
.checkin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.checkin-item{padding:14px 10px;text-align:center;border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;border:2px solid transparent;transition:all .15s}
.checkin-item:hover{border-color:var(--peach)}
.checkin-item.done{background:var(--mint-bg);border-color:var(--mint)}
.checkin-item .ci-icon{font-size:1.5rem;margin-bottom:4px;line-height:1}
.checkin-item .ci-name{font-size:.78rem;font-weight:600}
.checkin-item .ci-status{font-size:.65rem;color:var(--muted);margin-top:2px}

/* Calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-day-header{font-size:.65rem;color:var(--muted);padding:4px}
.cal-day{padding:8px 4px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .15s}
.cal-day:hover{background:var(--peach-bg)}
.cal-day.today{background:var(--peach);color:#fff;font-weight:700}
.cal-day.selected{background:var(--sky-bg);font-weight:600}
.cal-day.has-done{border-bottom:2px solid var(--mint)}
.cal-day.other{color:#ccc}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--card);border-top:1px solid var(--border);justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;color:var(--muted);min-height:52px;justify-content:center;font-weight:500}
.nav-tab.active{color:var(--peach);font-weight:700}
.nav-tab .nav-icon{font-size:1.2rem;font-weight:700}

.ai-fab{position:fixed;bottom:24px;right:24px;z-index:85;width:52px;height:52px;border-radius:50%;background:var(--peach);color:#fff;box-shadow:0 4px 20px rgba(244,167,139,.4);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;transition:all .2s}
.ai-panel{position:fixed;bottom:88px;right:24px;z-index:84;width:340px;max-height:420px;background:var(--card);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.12);display:none;flex-direction:column;overflow:hidden}
.ai-panel.show{display:flex}
.ai-panel-header{padding:14px 18px;border-bottom:1px solid var(--border);font-size:.88rem;font-weight:700;display:flex;justify-content:space-between}
.ai-panel-body{flex:1;overflow-y:auto;padding:10px;min-height:100px;font-size:.82rem}
.ai-panel-input{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:6px}
.ai-panel-input input{flex:1}

.modal-overlay{position:fixed;inset:0;background:rgba(60,40,20,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:16px}.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px;font-weight:600}
.modal-field input,.modal-field textarea,.modal-field select{width:100%}
.modal-field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(80,60,40,.9);color:#fff;padding:10px 24px;border-radius:22px;font-size:.8rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#FCE8DC,#FBEFCF);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:var(--radius);padding:32px 28px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.login-card h2{text-align:center;margin-bottom:18px;font-size:1.2rem}
.login-field{margin-bottom:14px}.login-field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px}
.login-field input{width:100%;padding:12px 16px;border-radius:22px}
.login-err{font-size:.72rem;color:#E84040;min-height:20px;margin-bottom:8px}
.login-btn{width:100%;padding:13px;background:var(--peach);color:#fff;border-radius:22px;font-size:.95rem;font-weight:700}

@media(max-width:768px){
  html{font-size:17px}
  #sidebar{transform:translateX(-100%);width:220px;padding-top:env(safe-area-inset-top,0);transition:transform .25s}
  #sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.15)}
  .menu-toggle{display:flex;width:40px;height:40px;border-radius:50%;background:var(--peach);color:#fff;align-items:center;justify-content:center;font-size:1.2rem}
  .side-toggle{display:block;text-align:center;padding:8px 0 14px;font-size:1.2rem;color:var(--muted)}
  #main{margin-left:0;padding:12px 14px 100px}
  #topbar{padding:0 0 12px}#topbar h1{font-size:1.2rem}
  .bottom-nav{display:flex}
  .ai-fab{bottom:80px;right:14px}.ai-panel{bottom:144px;right:14px;width:calc(100vw - 28px)}
  .add-bar{flex-direction:column}.btn{padding:10px 20px;font-size:.85rem}
  .card{padding:16px 14px;margin-bottom:10px;border-radius:var(--radius-sm)}
  .task-row{padding:12px 14px;font-size:.92rem}.task-cb{width:24px;height:24px}
  input,textarea,select{font-size:16px;padding:12px 14px}
  .checkin-grid{grid-template-columns:repeat(2,1fr)}
  .modal{max-width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0))}
  .modal-overlay{align-items:flex-end}
  /* 英雄卡移动端优化 */
  .hero-card{padding:20px 16px}
  .hero-card>div{flex-direction:column;gap:4px;justify-content:center;text-align:center}
  .hero-card .hero-stats{width:100%;justify-content:space-around;padding-top:10px;border-top:1px solid rgba(244,167,139,.2);margin-top:4px}
  .hero-card .hero-stats>div{flex:1}
  #toast{bottom:140px}
}
</style>
</head>
<body>
<div id="app">

<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>鸭鸭的加油站</h2>
    <div class="login-field"><label>用户名</label><input id="login-user" value="admin"></div>
    <div class="login-field"><label>密码</label><input id="login-pass" type="password" value="Admin123"></div>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" onclick="doLogin()">进入</button>
  </div>
</div>

<nav id="sidebar">
  <div class="side-toggle" onclick="toggleSidebar()">✕</div>
  <div class="side-logo">鸭鸭的加油站</div>
  <div class="sub-nav" id="sub-nav"></div>
</nav>

<main id="main">
  <div id="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1 id="page-title">总览</h1></div><div class="breadcrumb" id="breadcrumb"></div></div>
  <div id="content"></div>
</main>

<button class="ai-fab" onclick="toggleAI()">AI</button>
<div class="ai-panel" id="ai-panel">
  <div class="ai-panel-header">智能助手 <button onclick="toggleAI()">✕</button></div>
  <div class="ai-panel-body" id="ai-body">你好！</div>
  <div class="ai-panel-input"><input id="ai-input" placeholder="描述你想做的事..." onkeypress="if(event.key==='Enter')runAI()"><button class="btn btn-primary btn-xs" onclick="runAI()">发送</button></div>
</div>

<div class="bottom-nav" id="bottom-nav"></div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-body"></div></div>
<div id="toast"></div>

</div>

<script>
const genId=()=>'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}

const Store={
  envId:'yayaliu-d4g1i1dc2fdb04417',
  data:{tasks:[],health:[],xhs:[],investments:[],stores:[],inspirations:[],study:[],checkinRecords:[]},
  app:null,auth:null,db:null,ready:false,_hadSync:false,
  async initCloud(){
    if(typeof cloudbase==='undefined')throw new Error('SDK');
    const app=cloudbase.init({env:this.envId});let ls;try{ls=await app.auth.getLoginState()}catch(e){}
    if(!ls){const{error}=await app.auth.signInWithPassword({username:'admin',password:'Admin123'});if(error)throw new Error(error.message)}
    this.auth=app.auth;this.app=app;this.db=app.database();this.ready=true;
    await this.loadFromCloud();return true
  },
  async loadFromCloud(){
    if(!this.db)return;
    const dedup=(arr,k='id')=>{const s=new Set();return arr.filter(x=>{const v=x[k]||'';if(s.has(v))return false;s.add(v);return true})};
    const strip=d=>{const{_id,_openid,...r}=d;return r};
    const sg=async c=>{try{return(await this.db.collection(c).limit(1000).get()).data.map(strip)}catch(e){return[]}};
    Object.assign(this.data,{
      tasks:dedup(await sg('tasks')),health:dedup(await sg('health_records')),xhs:dedup(await sg('xiaohongshu')),
      investments:dedup(await sg('investments')),stores:dedup(await sg('stores')),inspirations:dedup(await sg('inspirations')),
      study:dedup(await sg('study_notes')),checkinRecords:await sg('checkin_records')
    });
    const has=Object.values(this.data).some(v=>Array.isArray(v)&&v.length>0);
    if(has){this.saveLocal();this._hadSync=true}else if(this._hadSync){this.data={tasks:[],health:[],xhs:[],investments:[],stores:[],inspirations:[],study:[],checkinRecords:[]};this.saveLocal()}
    else if(this.data.tasks.length||this.data.study.length)await this.saveToCloud()
  },
  async saveToCloud(){
    if(!this.db)return;
    const repl=async(col,it)=>{try{const e=await col.limit(1000).get();for(const d of e.data||[])try{await col.doc(d._id).remove()}catch(e){};for(const i of it)await col.add({...i})}catch(e){}}
    const colls=['tasks','health_records','xiaohongshu','investments','stores','inspirations','study_notes'];
    for(const c of colls)await repl(this.db.collection(c),this.data[c]||[]);
    await repl(this.db.collection('checkin_records'),this.data.checkinRecords||[]);
    this._hadSync=true;localStorage.setItem('ws_had','1');
  },
  loadLocal(){try{const r=localStorage.getItem('ws_data_v6a');if(r)this.data=Object.assign(this.data,JSON.parse(r));this._hadSync=localStorage.getItem('ws_had')==='1'}catch(e){}},
  saveLocal(){localStorage.setItem('ws_data_v6a',JSON.stringify(this.data))},
  async save(){this.saveLocal();clearTimeout(this._st);this._st=setTimeout(()=>this.saveToCloud(),500)},
  // Checkin helpers
  getRecord(type,dateStr){
    return this.data.checkinRecords.find(r=>r.type===type&&r.date===dateStr);
  },
  getWater(){
    const r=this.getRecord('water',today());return r?r.count:0;
  },
  addWater(){
    const d=today();let r=this.getRecord('water',d);
    if(r){if(r.count<8)r.count++}else this.data.checkinRecords.push({id:genId(),type:'water',date:d,count:1});
    this.saveLocal();this.saveToCloud();return this.getWater();
  },
  isSleepEarly(){
    const y=new Date();y.setDate(y.getDate()-1);return !!this.getRecord('sleep_early',y.toISOString().slice(0,10));
  },
  toggleSleep(){
    const d=new Date();d.setDate(d.getDate()-1);const ds=d.toISOString().slice(0,10);
    const idx=this.data.checkinRecords.findIndex(r=>r.type==='sleep_early'&&r.date===ds);
    if(idx>=0)this.data.checkinRecords.splice(idx,1);
    else this.data.checkinRecords.push({id:genId(),type:'sleep_early',date:ds,value:true});
    this.saveLocal();this.saveToCloud();
  },
  isWakeEarly(){return !!this.getRecord('wake_early',today());},
  toggleWake(){
    const d=today();const idx=this.data.checkinRecords.findIndex(r=>r.type==='wake_early'&&r.date===d);
    if(idx>=0)this.data.checkinRecords.splice(idx,1);
    else this.data.checkinRecords.push({id:genId(),type:'wake_early',date:d,value:true});
    this.saveLocal();this.saveToCloud();
  },
  getMealLevel(meal){
    const r=this.data.checkinRecords.find(r=>r.type==='meal'&&r.date===today()&&r.meal===meal);
    return r?r.level:null;
  },
  setMeal(meal,level){
    const d=today();
    const idx=this.data.checkinRecords.findIndex(r=>r.type==='meal'&&r.date===d&&r.meal===meal);
    if(level===null&&idx>=0){this.data.checkinRecords.splice(idx,1)}
    else if(idx>=0){this.data.checkinRecords[idx].level=level}
    else this.data.checkinRecords.push({id:genId(),type:'meal',date:d,meal,level});
    this.saveLocal();this.saveToCloud();
  },
  getWeekExercises(){
    const now=new Date(),dow=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1));
    const ws=mon.toISOString().slice(0,10);
    return this.data.checkinRecords.filter(r=>r.type==='exercise'&&r.date>=ws).length;
  },
  addExercise(){
    this.data.checkinRecords.push({id:genId(),type:'exercise',date:today(),value:true});
    this.saveLocal();this.saveToCloud();return this.getWeekExercises();
  },
  undoExercise(){
    const d=today();const idx=this.data.checkinRecords.findIndex(r=>r.type==='exercise'&&r.date===d);
    if(idx>=0)this.data.checkinRecords.splice(idx,1);
    this.saveLocal();this.saveToCloud();
  }
};

const modules=[
  {id:'home',label:'总览',icon:'家'},
  {id:'tasks',label:'待办',icon:'办'},
  {id:'revenue',label:'赚钱',icon:'赚'},
  {id:'study',label:'学习',icon:'学'}
];
const subMenus={
  home:[],
  tasks:[{id:'work',label:'工作待办',icon:'工'},{id:'life',label:'生活待办',icon:'生'},{id:'insp',label:'灵感',icon:'灵'}],
  revenue:[{id:'invest',label:'投资',icon:'投'},{id:'xhs',label:'小红书',icon:'红'},{id:'store',label:'网店',icon:'店'}],
  study:[{id:'japanese',label:'日语',icon:'日'},{id:'reading',label:'读书',icon:'读'}]
};
const moduleLabels={tasks:'待办',revenue:'赚钱',study:'学习'};
let currentModule='home',currentSub='work',sidebarOpen=false,aiOpen=false,taskTab='work',calDate=null;

function navigate(mod,sub){
  currentModule=mod;currentSub=sub||(subMenus[mod][0]||{}).id||'';
  if(mod==='tasks')taskTab=sub||'work';
  document.getElementById('page-title').textContent=modules.find(m=>m.id===mod).label;
  document.getElementById('breadcrumb').textContent=(subMenus[mod].find(s=>s.id===currentSub)||{}).label||'';
  let subHTML='<button class="sub-item"'+(!currentModule||currentModule==='home'?' active':'')+' onclick="navigate(\'home\')"><span class="sub-icon">家</span>总览</button>';
  Object.entries(subMenus).forEach(([key,items])=>{
    if(!items.length)return;
    subHTML+='<div class="sub-sec-title">'+moduleLabels[key]+'</div>';
    items.forEach(s=>subHTML+='<button class="sub-item'+(currentSub===s.id&&currentModule===key?' active':'')+'" onclick="navigate(\''+key+'\',\''+s.id+'\')"><span class="sub-icon">'+s.icon+'</span>'+s.label+'</button>');
  });
  document.getElementById('sub-nav').innerHTML=subHTML;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.nav-tab[data-mod="'+mod+'"]')?.classList.add('active');
  renderContent();
}
function toggleSidebar(){sidebarOpen=!sidebarOpen;document.getElementById('sidebar').classList.toggle('open',sidebarOpen)}
function toggleAI(){aiOpen=!aiOpen;document.getElementById('ai-panel').classList.toggle('show',aiOpen)}
function buildUI(){
  document.getElementById('bottom-nav').innerHTML=modules.map(m=>'<button class="nav-tab" data-mod="'+m.id+'" onclick="navigate(\''+m.id+'\')"><span class="nav-icon">'+m.icon+'</span>'+m.label+'</button>').join('');
  navigate('home')
}

// ====== Fetch weather ======
async function fetchWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.26&longitude=108.94&current=temperature_2m,weather_code&timezone=Asia/Shanghai');
    const d=await r.json();const wc={0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',51:'小雨',53:'中雨',61:'阵雨',71:'小雪',80:'雷雨'};
    return Math.round(d.current.temperature_2m)+''+(wc[d.current.weather_code]||'多云');
  }catch(e){return'--'}
}

// ====== Render ======
function renderContent(){
  const c=document.getElementById('content');
  if(currentModule==='home'&&currentSub==='calendar')renderCalendar(c);
  else if(currentModule==='home')renderHome(c);
  else if(currentModule==='tasks')renderTasks(c);
  else if(currentModule==='revenue')renderRevenue(c);
  else if(currentModule==='study')renderStudy(c);
}

// ====== Home ======
async function renderHome(c){
  const h=new Date().getHours(),g=h<12?'早上好呀':h<18?'下午好':'晚上好';
  const tasks=Store.data.tasks||[],health=Store.data.health||[];
  const pending=tasks.filter(t=>!t.completed);
  const todayHealth=health.filter(r=>r.date===today());
  const todayWeight=todayHealth.find(r=>r.weight)?.weight||'--';

// ====== Calendar ======
function renderCalendar(c){
  const now=calDate?new Date(calDate):new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=today();

  // Get dates with checkins or completed tasks
  const doneDates=new Set();
  Store.data.checkinRecords.forEach(r=>doneDates.add(r.date));
  Store.data.tasks.filter(t=>t.completedAt).forEach(t=>doneDates.add(t.completedAt));

  const selectDate=calDate||todayStr;
  const selectedEvents=[];
  Store.data.checkinRecords.filter(r=>r.date===selectDate).forEach(r=>{
    let title='';if(r.type==='water')title='喝水 '+r.count+'杯';
    else if(r.type==='sleep_early')title='早睡';
    else if(r.type==='wake_early')title='早起';
    else if(r.type==='meal')title=r.meal+'餐('+(r.level==='green'?'绿灯':r.level==='yellow'?'黄灯':'红灯')+')';
    else if(r.type==='exercise')title='运动';
    if(title)selectedEvents.push({type:'checkin',title,date:r.date});
  });
  Store.data.tasks.filter(t=>t.completedAt===selectDate).forEach(t=>selectedEvents.push({type:'task',title:t.title,date:t.completedAt,module:t.module}));

  let calHTML='<div class="cal-header"><button class="btn-outline btn-xs" onclick="calDate=null;calDate=new Date('+year+','+(month-1)+',1);renderContent()">◀</button><span style="font-weight:700">'+year+'年'+(month+1)+'月</span><button class="btn-outline btn-xs" onclick="calDate=null;calDate=new Date('+year+','+(month+1)+',1);renderContent()">▶</button></div>';

  calHTML+='<div class="cal-grid"><div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>';

  for(let i=0;i<firstDay;i++)calHTML+='<div class="cal-day other"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayStr,isSelected=ds===selectDate,hasDone=doneDates.has(ds);
    calHTML+='<div class="cal-day'+ (isToday?' today':'')+ (isSelected?' selected':'')+ (hasDone?' has-done':'')+'" onclick="calDate=\''+ds+'\';renderContent()">'+d+'</div>';
  }
  calHTML+='</div><div style="margin-top:16px"><div class="card-title" style="margin-bottom:8px">'+(calDate||todayStr)+' 完成记录</div>';
  calHTML+=(selectedEvents.length?selectedEvents.map(e=>'<div class="task-row"><span class="badge '+(e.type==='checkin'?'badge-mint':'badge-peach')+'">'+(e.type==='checkin'?'打卡':'任务')+'</span><span>'+e.title+'</span></div>').join(''):'<div style="color:var(--muted);text-align:center;padding:16px">当天没有完成记录</div>');
  calHTML+='</div>';

  c.innerHTML='<div class="card">'+calHTML+'</div><div style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="navigate(\'home\')">← 返回总览</button></div>';
}

  const inp=document.getElementById('ai-input'),q=inp.value.trim();if(!q){toggleAI();return}inp.value='';
  const body=document.getElementById('ai-body');let resp='好的鸭~';
  if(q.includes('添加')){addTask();resp='已添加待办'}
  else if(q.includes('打卡')||q.includes('健康')){navigate('home');resp='已打开总览'}
  else if(q.includes('日历')||q.includes('历史')){navigate('home','calendar');resp='已打开日历'}
  else if(q.includes('看看')||q.includes('进度')){navigate('home');resp='已打开总览'}
  else if(q.includes('投资')){navigate('revenue','invest');resp='已打开投资'}
  else resp='需要大模型协助，配个API Key哦~';
  body.innerHTML='<div style="padding:8px;background:var(--peach-bg);border-radius:8px;margin-bottom:6px">'+resp+'</div>'+body.innerHTML;
}

// ====== Login ======
async function doLogin(){
  const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value,e=document.getElementById('login-err');
  if(!u||!p){e.textContent='请输入';return}
  e.textContent='验证中...';
  try{
    const app=cloudbase.init({env:Store.envId});const{data:d,error:er}=await app.auth.signInAnonymously();
    if(er)throw new Error('连接失败');const db=app.database();
    const{data:res}=await db.collection('users').where({username:u,password:p}).get();
    if(!res||res.length===0){e.textContent='用户名或密码错误';return}
  }catch(ex){e.textContent='验证失败';return}
  document.getElementById('login-overlay').style.display='none';localStorage.setItem('ws_logged','1');
  Store.loadLocal();await Store.initCloud();buildUI();
}
(async function init(){
  buildUI();const loggedIn=localStorage.getItem('ws_logged')==='1';
  if(!loggedIn)return;
  document.getElementById('login-overlay').style.display='none';
  Store.loadLocal();await Store.initCloud();buildUI();
})();
</script>
