<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鸭鸭的加油站</title>
<style>
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FBF6EE;color:#97876E;font-size:.9rem}
.spinner{width:32px;height:32px;border:3px solid #F0E5D2;border-top-color:#F4A78B;border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>加载中...</div>
<div id="app" style="display:none"></div>
<script>
// 从 Gitee 拉取最新 index.html 并渲染
(async function(){
  try{
    // Gitee API 获取文件内容（需要token，因为仓库是私有的）
    const token='GITEE_TOKEN_PLACEHOLDER';
    const url='https://gitee.com/api/v5/repos/wonderful-delight/personal-workspace/contents/index.html?ref=main&access_token='+token;
    const res=await fetch(url);
    const data=await res.json();
    
    if(data && data.content){
      // Base64 解码文件内容
      const html=atob(data.content.replace(/\n/g,''));
      // 写入页面
      document.open();
      document.write(html);
      document.close();
    }else{
      throw new Error(data.message||'获取失败');
    }
  }catch(e){
    document.getElementById('loading').innerHTML='加载失败: '+e.message+'<br>请刷新重试';
  }
})();
</script>
</body>
</html>
